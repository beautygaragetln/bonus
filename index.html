<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beauty Garage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2ABC4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beauty Garage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500;1,6..96,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* iOS/Android: шрифт полей >=16px, иначе Safari приближает страницу при вводе и не возвращает */
input,select,textarea{font-size:16px!important;touch-action:manipulation}
button,a,label,summary{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

:root{
  --bg:#F3EDE7; --surface:#FBF8F5; --fg:#3E2C29; --muted:#74655F; --line:#E2D6CC;
  --accent:#713E4B; --accent-fg:#F3EDE7; --pink:#F2B7CC; --soft:#F7E3EA; --taupe:#B7A79F;
  --good:#3F7D5C; --bad:#A8403F;
  --display:'Bodoni Moda',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#241917; --surface:#3E2C29; --fg:#F3EDE7; --muted:#B7A79F; --line:#57433F;
  --accent:#F2B7CC; --accent-fg:#3E2C29; --soft:#4B3338;
  --good:#7FCFA3; --bad:#F08A86; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:20px max(16px,env(safe-area-inset-left,0px)) 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 30px/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font:600 21px/1.2 var(--display);margin:0}
h3{font:600 19px/1.2 var(--display);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:none;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:92px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px}
label.check input{width:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{display:block;font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;border-radius:0;width:100%;text-align:left;font-weight:500}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .bal{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.pill.solid{background:var(--accent);color:var(--accent-fg)}
.balance{font:600 54px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--soft);padding:10px 12px;border-radius:10px;font-size:13px}
.hint.warn{background:var(--accent);color:var(--accent-fg)}
.ways{display:flex;flex-direction:column}
.ways div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ways div:first-child{border-top:0}
.ways b{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}
.edit-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
/* Glam Levels */
.lv{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;flex:none;border:1px solid rgba(183,167,159,.55);gap:2px}
.lv svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lv small{font-size:8px;font-weight:700;letter-spacing:.1em}
.lv.big{width:84px;height:84px}.lv.big svg{width:34px;height:34px}.lv.big small{font-size:9px}
.lv.sm{width:40px;height:40px}.lv.sm svg{width:20px;height:20px}.lv.sm small{display:none}
.lv0{background:#F3EDE7;color:#3E2C29}
.lv1{background:#F2B7CC;color:#713E4B}
.lv2{background:#B7A79F;color:#3E2C29}
.lv3{background:#713E4B;color:#F2B7CC}
.lv4{background:#3E2C29;color:#F2B7CC}
.gl-head{display:flex;align-items:center;gap:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ladder{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:14px 0;font-weight:500}
.lrow:first-child{border-top:0}
.lrow .lt{display:flex;flex-direction:column;flex:1;min-width:0}
.lrow .lt b{font:600 17px var(--display);letter-spacing:.02em;text-transform:uppercase}
.lrow .lt span{font-size:13px;color:var(--muted)}
.lbadge{font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.lrow.current{background:var(--soft);border-radius:14px;padding:14px 12px;margin:2px -12px;width:calc(100% + 24px);border-top-color:transparent}
.lrow.current .lbadge{color:var(--accent)}
.lrow.passed .lbadge{color:var(--good)}
.lrow.locked .lv{opacity:.45;filter:grayscale(.4)}
.lrow.locked .lt{opacity:.7}
.hello{font:italic 600 28px/1.15 var(--display);margin:4px 0 0}
.acct-slim{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.link{background:none;border:0;padding:2px 4px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.rw-hero{position:relative;background:#713E4B;color:#F3EDE7;border-radius:20px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px}
.rw-hero .hc-top{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.rw-hero .rw-more{position:absolute;top:14px;right:14px;background:none;border:0;color:#F2B7CC;font-size:12px;padding:4px 6px;cursor:pointer}
.rw-big{font:600 46px/1 var(--display);font-variant-numeric:tabular-nums}
.rw-sub{font-size:13px;opacity:.85}.rw-hero hr{border:0;border-top:1px solid rgba(243,237,231,.25);margin:6px 0}
.rw-hero .rowline{font-size:14px}.rw-hero .bar{background:rgba(243,237,231,.22)}.rw-hero .bar i{background:#F2B7CC}
.rw-left{font-size:12px;opacity:.8}
.cpn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cpn-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);cursor:pointer;text-align:center;min-width:0}
.cpn-tile svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cpn-tile b{font-size:18px}.cpn-tile small{font-size:11px;color:var(--muted)}
.cpn-tile.locked{background:#E7DAD1;border-color:#E7DAD1;cursor:default;color:var(--muted)}
.cpn-tile.on{background:var(--pink);border-color:var(--pink);color:#3E2C29}.cpn-tile.on small{color:#3E2C29}
.wl-card{display:flex;align-items:center;gap:12px;background:var(--pink);border-radius:16px;padding:14px 16px;color:#3E2C29}
.wl-card svg{width:24px;height:24px;flex:none;fill:none;stroke:#3E2C29;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wl-card span{display:flex;flex-direction:column;gap:2px;min-width:0}.wl-card small{font-size:12px;opacity:.85}
.ref-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--fg);text-align:left;cursor:pointer;width:100%}
.ref-card svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ref-card span{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.ref-card small{font-size:12px;color:var(--muted)}.ref-card .chev{flex:none;flex:0 0 auto;color:var(--muted)}
.ref-code{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ref-code b{font:600 26px/1.1 var(--display);letter-spacing:.06em;word-break:break-all}
.tk-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}.tk-row:first-child{border-top:0}.tk-go{display:block;color:var(--accent);font-weight:600;font-size:13px}.tk-sub{display:block;color:var(--muted);font-size:13px}.claim-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.claim-row:first-child{border-top:0}.claim-row a{color:var(--accent);word-break:break-all;font-size:14px}.claim-st{white-space:nowrap;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft)}.claim-st.ok{background:var(--pink);color:#3E2C29}
.ref-btns{display:flex;gap:8px;flex-wrap:wrap}.ref-enter{display:flex;gap:8px}.ref-enter input{flex:1;min-width:0;text-transform:uppercase}.ref-enter button{white-space:nowrap}
.ref-steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.cpn-note{display:flex;justify-content:space-between;gap:10px;align-items:center}.cpn-help{margin:-4px 0 0}
.lvl-card{gap:10px}.lvl-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.lvl-ic{width:42px;height:42px;border-radius:50%;background:var(--pink);display:grid;place-items:center;flex:none}
.lvl-ic svg{width:22px;height:22px;fill:none;stroke:#713E4B;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lvl-tx{display:flex;flex-direction:column;flex:1}.lvl-tx small{color:var(--muted);font-size:12px}.lvl-tx b{font-size:16px;letter-spacing:.03em}
.chev{font-size:22px;color:var(--muted)}.lvl-tasks{display:flex;flex-direction:column;gap:6px}
.ms-card{gap:12px;cursor:pointer}.ms-card h2{margin:0;font-size:20px}
.ms-dots{display:flex;gap:10px;flex-wrap:wrap}
.ms-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.ms-dot svg{width:15px;height:15px;fill:none;stroke:#713E4B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ms-dot.done{background:var(--pink);border-color:var(--pink)}.ms-dot.gift{background:#E7DAD1;border-color:#E7DAD1}
.miss-card{display:flex;align-items:center;gap:12px;background:var(--pink);border:0;border-radius:16px;padding:16px 18px;color:#3E2C29;text-align:left;cursor:pointer}
.miss-card svg{width:24px;height:24px;flex:none;fill:none;stroke:#3E2C29;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.miss-card span{display:flex;flex-direction:column;gap:2px}.miss-card small{font-size:12px;opacity:.85}
.cta-bar{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;background:#3E2C29;color:#F3EDE7;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:600;cursor:pointer}
.cta-bar svg{width:18px;height:18px;fill:none;stroke:#F3EDE7;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rw-card .rowline{gap:8px;align-items:center}.rw-card .rowline h2{white-space:nowrap}.rw-card .rowline button{font-size:13px;padding:8px 12px;white-space:nowrap}
.rw-bal{display:flex;align-items:baseline;gap:10px}
.cpn-row{display:flex;gap:8px;flex-wrap:wrap}.cpn-row button{flex:1;min-width:88px}
.cpn-active{display:flex;flex-direction:column;gap:6px}
details.more>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary h2{margin:0}
details.more>summary::after{content:'▾';opacity:.6;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(180deg)}
details.more[open]>summary{margin-bottom:10px}
.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.sheet-bg,.sheet{overscroll-behavior:contain}
.sheet-bg{position:fixed;inset:0;background:rgba(36,25,23,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet.center{text-align:center;align-items:center}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.confetti{font:600 34px/1.1 var(--display);color:var(--accent)}
.perks div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.perks div:first-child{border-top:0}
.perks b{text-align:right}
ul.plain{margin:6px 0 0;padding-left:18px}
.wheel-card,.gift-card{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.wheel-card{background:linear-gradient(135deg,#713E4B,#A5677B);color:#F3EDE7;border:0;cursor:pointer}
.gift-card{background:var(--pink);color:#3E2C29}.gift-card.used{opacity:.6}
.wheel-card svg,.gift-card svg{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wheel-card span,.gift-card span{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.wheel-card small,.gift-card small{font-size:12px;opacity:.85}.wheel-card .chev{flex:none}
.wheel-box{display:flex;justify-content:center}.wheel-svg{width:100%;max-width:320px;height:auto}
.wh-win{text-align:center;display:flex;flex-direction:column;gap:6px;background:var(--pink);color:#3E2C29;border-radius:16px;padding:16px}.wh-win b{font:600 20px/1.25 var(--display)}.wh-win p,.wh-win .eyebrow{color:#3E2C29;opacity:.85}
.pref-sel{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.help-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ig-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:16px 10px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);text-decoration:none;min-width:0}
.ig-tile b{font-size:15px;overflow-wrap:anywhere}.ig-tile small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ig-ic{width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.ig-ic svg{width:24px;height:24px;fill:none;stroke:#F3EDE7;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ig-ic .ig-dot{fill:#F3EDE7;stroke:none}
.ig-cta{margin-top:8px;padding:6px 16px;border-radius:99px;background:var(--pink);color:#3E2C29;font-weight:700;font-size:13px}
.ig-tile:hover .ig-cta{filter:brightness(.95)}
.help-card{gap:10px;align-items:center;text-align:center}.help-card h2{margin:0}.help-card p{margin:0}
.rules-sec{margin-top:16px}.rules-sec h4{margin:0 0 8px;font:600 15px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.rules-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules-sec li{position:relative;padding-left:18px;font-size:14px;line-height:1.45}
.rules-sec li::before{content:'';position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--pink)}
@media (max-width:560px){.edit-row{grid-template-columns:1fr 1fr}.edit-row label:first-child{grid-column:1/-1}}
@media (max-width:480px){.stats{gap:8px}.stat b{font-size:19px}.balance{font-size:46px}h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v3: Beauty Garage Club */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .eyebrow{letter-spacing:.18em}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.langs button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
h1,.it{font-style:normal}
.hero-card{background:#713E4B;color:#F3EDE7;border-radius:20px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:6px}
.hero-card .hc-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hero-card .hc-top svg{width:22px;height:22px;fill:none;stroke:#F2B7CC;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hc-level{font:italic 600 34px/1.1 var(--display);margin-top:6px}
.hc-sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero-card hr{border:0;border-top:1px solid rgba(243,237,231,.25);margin:14px 0 10px;width:100%}
.hc-label{font-size:14px;opacity:.9}
.hc-balance{font:600 40px/1.1 var(--display);font-variant-numeric:tabular-nums}
.hc-note{font-size:13px;opacity:.85}
.hc-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hc-chips .pill{background:rgba(243,237,231,.16);color:#F3EDE7}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rowline b{font-weight:700}
.block{display:flex;flex-direction:column;gap:8px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.callout b{color:var(--accent);font:italic 600 17px var(--display)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:center}

/* навигация: каждый экран = запись в истории браузера, поэтому «Назад» на Android и в браузере работает */
function go(s){
  scrollMem[curScreen()||'home']=scrollNow();
  sheet=null; lvlup=null; screen=(s==='home'||!s)?null:s; window.__moreOpen=false; window.__navAnim=true;
  try{
    if(shPushed){ history.replaceState({bg:1,s:screen},''); shPushed=false; }
    else if(!screen) history.replaceState({bg:1,s:null},'');
    else history.pushState({bg:1,s:screen},'');
  }catch(e){}
  render(); window.scrollTo(0,0);
}
function goBack(){
  try{ if(history.state&&history.state.bg&&history.state.s){ history.back(); return; } }catch(e){}
  screen=null; window.__navAnim=true; render(); window.scrollTo(0,scrollMem.home||0);
}
window.addEventListener('popstate',e=>{
  if(ignorePop>0){ ignorePop--; return; }
  if(shPushed){
    shPushed=false;
    if(sheet&&(sheet.type==='newpw'||sheet.phase==='spinning')){ try{ history.pushState({bg:1,s:screen,sh:1},''); shPushed=true; }catch(_){} return; }
    sheet=(sheet&&sheet.back)||null; lvlup=null; if(!sheet) maybeAskPush(); render(); return;
  }
  const st=e.state; screen=(st&&st.bg&&st.s)||null; window.__navAnim=true; render(); window.scrollTo(0,scrollMem[screen||'home']||0);
});
try{ if(history.state&&history.state.bg&&history.state.s) history.replaceState({bg:1,s:null},''); }catch(e){}

/* ---------- главная ---------- */
function gpStats(w){
  const rate=w.rate||20, cps=(w.coupons||[]).filter(a=>a<=w.maxVisit).sort((a,b)=>a-b);
  const aff=cps.filter(a=>a*rate<=w.bal), best=aff.length?aff[aff.length-1]:0, nxt=cps.find(a=>a*rate>w.bal);
  const lo=best?best*rate:0, hi=nxt?nxt*rate:0;
  return {rate,best,nxt,pc:nxt?Math.max(0,Math.min(100,Math.round((w.bal-lo)/(hi-lo)*100))):100,left:nxt?r2(hi-w.bal):0};
}
function gpCard(w,click){
  const s=gpStats(w), act=w.coupon;
  const inner=`<span class="hc-top"><span>${esc(t('rwTitle'))}</span>${click?'<span class="chev-pink" aria-hidden="true">›</span>':''}</span>
    <span class="rw-big">${esc(gp(w.bal))}</span>
    <span class="rw-best">${esc(s.best?t('rwBest',eur(s.best)):t('rwBestNone'))}</span>
    <span class="bar" role="progressbar" aria-valuenow="${s.pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.pc}%"></i></span>
    <span class="rw-left">${esc(s.nxt?t('rwToNext',gp(s.left),eur(s.nxt)):t('rwMaxed'))}</span>
    ${act?`<span class="rw-left">${esc(t('rwActiveCpn',eur(act.a)))} · ${esc(t('cpnOn',fmtDate(act.exp)))}</span>`:''}`;
  return click?`<button class="rw-hero rw-click" data-go="rewards">${inner}</button>`:`<div class="rw-hero">${inner}</div>`;
}

  else body=`<div class="home${anim}">${draft}${homeScreen()}</div>${bottomNav()}`;

  bindAuth(); bindBooking(); bindPush(); bindRef(); bindWheel();
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
  document.querySelectorAll('[data-cpn]').forEach(b=>b.onclick=()=>rwCoupon(+b.dataset.cpn));

  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ setLang(b.dataset.lang); render(); if(pushSt.sub) pushRefresh(); });
  document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ sheet={type:'level',i:+b.dataset.lv}; render(); const c=document.getElementById('sheetClose'); if(c) c.focus(); });
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{ if(e.target===b){ if(sheet&&sheet.type==='newpw') return; if(sheet&&sheet.type==='wheel'&&sheet.phase==='spinning') return; const np=b.dataset.newperks; const bk0=sheet&&sheet.back; sheet=np!==undefined?{type:'level',i:+np}:(bk0||null); lvlup=null; if(!sheet) maybeAskPush(); render(); } }));
  const sh1=document.querySelector('.sheet'); if(sh1) sh1.scrollTop=sTop;
  /* окно поверх экрана = ещё одна запись в истории: системная «Назад» сначала закрывает окно */
  const need=!!(sheet||lvlup!=null), locked=document.body.classList.contains('lock');
  try{
    if(need&&!shPushed){ history.pushState({bg:1,s:screen,sh:1},''); shPushed=true; }
    else if(!need&&shPushed){ shPushed=false; if(history.state&&history.state.sh){ ignorePop++; history.back(); } }
  }catch(e){}
  /* пока открыто окно (sheet), страница под ним не прокручивается */
  if(need&&!locked){ lockY=y0; document.body.style.top=(-y0)+'px'; document.body.classList.add('lock'); }
  else if(!need&&locked){ document.body.classList.remove('lock'); document.body.style.top=''; window.scrollTo(0,lockY); }

}

function checkLevelUp(){
  if(!rec||!glamOn()) return;
  const gc=gcOf(rec), k='glamLvl:'+keyOf(rec.login); let prev=null;
  try{ prev=localStorage.getItem(k); }catch(e){}
  const ev=gc.log.filter(e=>e.type==='up'||e.type==='restore').pop(), fresh=ev&&Date.now()-ev.ts<14*DAY;
  if((prev!==null&&gc.level>+prev)||(prev===null&&gc.level>0&&fresh)) lvlup=gc.level;
  try{ localStorage.setItem(k,String(gc.level)); }catch(e){}
}

function bindAuth(){

  const f=document.getElementById('authForm');
  if(f) f.addEventListener('submit',e=>{ e.preventDefault();
    if(authTab==='register'){
      if(!document.getElementById('aConsent').checked){ authErr=tk('e_consent'); render(); return; }
      const em0=val('aEmail'), mk0=document.getElementById('aMkt').checked, lg=val('aLogin'), nm=val('aName'), pw=document.getElementById('aPin').value, ph=val('aPhone');
      if(!pwOk(pw)){ const pe=document.getElementById('aPinErr'); if(pe) pe.textContent=t('e_bad_pin'); return; }
      emReady(em0).then(st=>{ if(em0&&st!=='ok'){ const m=emMsg(st,em0); if(m){ document.getElementById('aEmailErr').textContent=m; } return; }
        doRegister(lg,nm,pw,em0,mk0&&!!em0,ph,val('aRef')); });

  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const a=b.dataset.act;

    else if(a==='profile'){ go('profile'); }

    else if(a==='referral'){ go('invite'); }

function downloadIcs(id){
  const b=(rec.bookings||[]).find(x=>x.id===id); if(!b) return;
  const f=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const x=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Beauty Garage//EN','BEGIN:VEVENT',`UID:${b.id}@beautygarage`,`DTSTAMP:${f(Date.now())}`,`DTSTART:${f(b.start)}`,`DTEND:${f(b.end)}`,
    `SUMMARY:${x(svcName(b.service)+' · '+cfg.studio)}`,`DESCRIPTION:${x(b.status==='pending'?t('stPending'):t('stConfirmed'))}`,`STATUS:${b.status==='pending'?'TENTATIVE':'CONFIRMED'}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})), a=document.createElement('a');
  a.href=url; a.download='beauty-garage.ics'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
/* ---------- обновления по записям: красная точка, баннер, значок на иконке ---------- */
const seenKey=()=>'bgSeen:'+(rec?rec.login:'');
const seenGet=()=>{ try{ return JSON.parse(localStorage.getItem(seenKey())||'null'); }catch(e){ return null; } };
const seenSet=m=>{ try{ localStorage.setItem(seenKey(),JSON.stringify(m)); }catch(e){} };
function seenSeed(){ if(!rec||seenGet()) return; const m={}; (rec.bookings||[]).forEach(b=>{ m[b.id]=b.status; }); seenSet(m); }
function seenMark(ids){ if(!rec) return; const m=seenGet()||{}; (rec.bookings||[]).forEach(b=>{ if(!ids||ids.includes(b.id)) m[b.id]=b.status; }); seenSet(m); }
function notices(){
  if(!rec) return [];
  const m=seenGet(); if(!m) return [];
  const out=[], now=Date.now();
  (rec.bookings||[]).forEach(b=>{
    const prev=m[b.id]; if(prev===b.status) return;
    if(b.status==='declined') out.push({b,kind:'declined'});
    else if(b.status==='cancelled'&&b.end>now-7*864e5) out.push({b,kind:'cancelled'});
    else if(b.status==='confirmed'&&prev==='pending') out.push({b,kind:'confirmed'});
  });
  return out.sort((a,b)=>b.b.start-a.b.start);
}
function updateBadge(){
  try{ const n=notices().length; if(n&&navigator.setAppBadge) navigator.setAppBadge(n); else if(!n&&navigator.clearAppBadge) navigator.clearAppBadge(); }catch(e){}
}
function noticePanel(){
  const ns=notices(); if(!ns.length) return '';

  return `<div class="panel notice" role="status"><div class="eyebrow"><span class="dot" style="margin:0"></span>${esc(t('nTitle'))}</div>
    ${ns.map(({b,kind})=>`<div class="bk-row"><div><b>${esc(t(msg[kind],dayLabel(b.ld)+', '+b.lt))}</b><div class="muted small">${esc(svcName(b.service))}</div>${b.admin_note&&kind!=='confirmed'?`<div class="small">${esc(t('nComment'))} ${esc(b.admin_note)}</div>`:(b.admin_note?`<div class="small">${esc(b.admin_note)}</div>`:'')}</div>

let refreshing=false;
async function refreshRec(){
  if(refreshing||!rec||!cred||!cred.pin||busy) return;
  if((sheet&&sheet.type==='book')||curScreen()==='profile') return;
  const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;

    const data=await rpc('client_login',{p_login:cred.login,p_pin:cred.pin});
    if(data&&!data.error){
      const sig=r=>JSON.stringify((r.bookings||[]).map(b=>[b.id,b.status,b.start]))+r.b+'|'+r.level;

}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshRec(); });

setInterval(()=>{ if(!document.hidden) refreshRec(); },60000);
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='push') refreshRec(); });

/* ---------- установка (PWA) и push ---------- */
const isStandalone=()=>{ try{ return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }catch(e){ return false; } };
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushSupported=()=>('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
const pushVisible=()=>{ let t=false; try{ t=/[?&]push=1/.test(location.search); if(t) localStorage.setItem('bgPushTest','1'); else t=localStorage.getItem('bgPushTest')==='1'; }catch(e){} return !!(pushCfg&&pushCfg.key&&(pushCfg.show||t)); };
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(typeof render==='function'&&cfg) render(); });
window.addEventListener('appinstalled',()=>{ installEvt=null; render(); });

  if(hide) return `<div style="text-align:center"><button class="ghost" data-act="install">${esc(t('insLink'))}</button></div>`;
  return `<div class="panel install"><div><b>${esc(t('insTitle'))}</b><div class="muted small">${esc(t('insSub'))}</div></div>

}

function notifyPanel(){
  if(!rec||!pushVisible()) return '';
  try{ if(typeof Notification!=='undefined') lastPerm=Notification.permission; }catch(e){}
  const head=`<h2>${esc(t('pnTitle'))}</h2><p class="muted small">${esc(t('pnWhat'))}</p>`;
  const wrap=x=>`<div class="panel">${head}${x}${pushSt.msg?`<div class="small ${pushSt.err?'neg':'pos'}">${esc(pushSt.msg)}</div>`:''}</div>`;
  if(isIOS()&&!isStandalone()) return wrap(`<p>${esc(t('pnNeedInstall'))}</p><button data-act="install">${esc(t('insBtn'))}</button>`);
  if(!pushSupported()) return wrap(`<p class="muted">${esc(t('pnUnsupported'))}</p>`);
  if(Notification.permission==='denied') return wrap(`<p class="neg small">${esc(t('pnDenied'))}</p><button data-act="pnRecheck">${esc(t('pnRecheck'))}</button>`);
  if(!pushSt.sub) return wrap(`<button class="primary" data-act="pushOn" ${pushSt.busy?'disabled':''}>${esc(pushSt.busy?t('wait'):t('pnOn'))}</button>`);
  const p=pushSt.prefs||{};

    <label class="pref-sel"><span>${esc(t('pnDaily'))}</span><select data-prefv="daily">${[['daily','pnDailyDaily'],['3w','pnDaily3w'],['off','pnDailyOff']].map(([v,k])=>`<option value="${v}" ${(p.daily||'daily')===v?'selected':''}>${esc(t(k))}</option>`).join('')}</select></label>
    <button class="ghost" data-act="pushOff">${esc(t('pnOff'))}</button>`);
}
const b64u=k=>{ const p='='.repeat((4-k.length%4)%4), b=atob((k+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); };
async function swReg(){ try{ return await navigator.serviceWorker.ready; }catch(e){ return null; } }
async function pushRefresh(){
  if(!rec||!cred||!pushVisible()||!pushSupported()||(isIOS()&&!isStandalone())){ return; }
  try{
    const reg=await swReg(); if(!reg) return;
    const sub=await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){
      const k=sub.toJSON().keys||{};
      const r=await rpc('push_subscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint,p_p256dh:k.p256dh,p_auth:k.auth,p_ua:navigator.userAgent,p_lang:lang});
      pushSt.sub=!!r.ok; pushSt.prefs=r.prefs||null;
    } else pushSt.sub=false;
    pushSt.checked=true;
  }catch(e){}
  maybeAskPush();
  render();
}
async function pushOn(){
  pushSt.busy=true; pushSt.msg=''; pushSt.err=false; render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ pushSt.busy=false; if(perm==='default'){ pushSt.msg=tk('pnDismissed'); pushSt.err=false; } render(); return; }
    const reg=await swReg();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pushCfg.key)});
    const k=sub.toJSON().keys||{};
    const r=await rpc('push_subscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint,p_p256dh:k.p256dh,p_auth:k.auth,p_ua:navigator.userAgent,p_lang:lang});
    if(!r.ok){ await sub.unsubscribe(); throw new Error(r.error||'x'); }
    pushSt.sub=true; pushSt.prefs=r.prefs; pushSt.msg='';
  }catch(e){ pushSt.msg=tk('pnFail'); pushSt.err=true; }
  pushSt.busy=false; render();
}
async function pushOff(){
  try{
    const reg=await swReg(), sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ await rpc('push_unsubscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint}); await sub.unsubscribe(); }
  }catch(e){}
  pushSt.sub=false; pushSt.msg=''; render();
}
let lastPerm=(typeof Notification!=='undefined')?Notification.permission:'';
function permWatch(){ if(typeof Notification==='undefined') return; if(Notification.permission!==lastPerm){ lastPerm=Notification.permission; pushSt.msg=''; render(); pushRefresh(); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) permWatch(); });

try{ if(navigator.permissions&&navigator.permissions.query) navigator.permissions.query({name:'notifications'}).then(ps=>{ ps.onchange=permWatch; }).catch(()=>{}); }catch(e){}
function maybeAskPush(){
  if(!rec||sheet||lvlup!=null||!pushSt.checked||pushSt.sub||!pushVisible()||!pushSupported()||(isIOS()&&!isStandalone())) return false;

  let z=0,ss=false; try{ z=+localStorage.getItem('bgPushLater')||0; ss=sessionStorage.getItem('bgPushAsk')==='1'; }catch(e){}
  if(ss||Date.now()-z<7*864e5) return false;
  try{ sessionStorage.setItem('bgPushAsk','1'); }catch(e){}

}

}

function bindPush(){
  document.querySelectorAll('[data-act]').forEach(b=>{ const a=b.dataset.act;
    if(a==='install') b.onclick=()=>{ sheet={type:'install'}; render(); };
    else if(a==='insHide') b.onclick=()=>{ try{ localStorage.setItem('bgInstallHide','1'); }catch(e){} render(); };
    else if(a==='nativeInstall') b.onclick=async()=>{ if(installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; sheet=null; render(); } };
    else if(a==='seen') b.onclick=()=>{ seenMark([b.dataset.id]); updateBadge(); render(); };
    else if(a==='pnRecheck') b.onclick=()=>{ pushSt.msg=''; render(); pushRefresh(); };
    else if(a==='pushAskYes') b.onclick=()=>{ sheet=null; pushOn(); };
    else if(a==='pushAskLater') b.onclick=()=>{ try{ localStorage.setItem('bgPushLater',String(Date.now())); }catch(e){} sheet=null; render(); };
    else if(a==='pushOn') b.onclick=pushOn;
    else if(a==='pushOff') b.onclick=pushOff; });
  document.querySelectorAll('[data-pref],[data-prefv]').forEach(el=>el.onchange=savePrefs);
