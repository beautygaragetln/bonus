<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бонусы студии</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#faf6f8; --surface:#ffffff; --fg:#2b2232; --muted:#7b6f84; --line:#eadfe6;
  --accent:#7a3b69; --accent-fg:#ffffff; --soft:#f1e3ec; --good:#2f7d5b; --bad:#b4413f;
  --display:'Fraunces',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1520; --surface:#251d2b; --fg:#f3eaf1; --muted:#a396ad; --line:#3a2f43;
  --accent:#d68cc0; --accent-fg:#1b1520; --soft:#3a2740; --good:#6fcf9f; --bad:#f08a86; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:20px max(16px,env(safe-area-inset-left,0px)) 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 28px/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:600 20px/1.2 var(--display);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:none;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{display:block;font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;border-radius:0;width:100%;text-align:left;font-weight:500}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .bal{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}
.balance{font:600 52px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--soft);padding:10px 12px;border-radius:8px;font-size:13px}
.ways{display:flex;flex-direction:column}
.ways div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ways div:first-child{border-top:0}
.ways b{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:90vw}
.edit-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:560px){.edit-row{grid-template-columns:1fr 1fr}.edit-row label:first-child{grid-column:1/-1}}
@media (max-width:480px){.stats{gap:8px}.stat b{font-size:19px}.balance{font-size:44px}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загрузка…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const r2 = n => Math.round(n*100)/100;
const eur = n => r2(n).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/^@+/,'').replace(/\s+/g,' ').trim();
function hash(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const keyOf = s => hash(norm(s),0)+hash(norm(s),7);
const DAY = 864e5;
const reward = a => a.type==='pct' ? `скидка ${a.val}%` : `+${r2(a.val)} €`;
const tierFor = (cfg,spent) => cfg.tiers.reduce((t,x)=>spent>=x.from?x:t, cfg.tiers[0]);
const nextTier = (cfg,spent) => cfg.tiers.find(x=>x.from>spent);
function rulesText(cfg){
  const t=[];
  t.push(cfg.mode==='next' ? 'Бонусы действуют на ближайший визит. Что не потратили — сгорает.' : 'Бонусы копятся, и тратить их можно в любой момент и в любой сумме.');
  if(cfg.expireDays>0) t.push(`Срок действия — ${cfg.expireDays} дн. с последнего начисления.`);
  if(cfg.maxPct<100) t.push(`Бонусами можно оплатить до ${cfg.maxPct}% стоимости визита.`);
  return t;
}


const app=document.getElementById('app');
let cfg=null, q='', result=null, notFound=false, err='', busy=false;
try{ q=localStorage.getItem('bonusQuery')||''; }catch(e){}
const configured = window.SUPABASE_URL && !String(window.SUPABASE_URL).startsWith('ВСТАВЬТЕ');
const sb = configured && window.supabase ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY) : null;

function card(c){
  const e=(cfg.expireDays>0 && c.b>0 && c.l>0) ? c.l+cfg.expireDays*DAY : 0;
  const expired=e && Date.now()>e, bal=expired?0:c.b;
  const t=tierFor(cfg,c.s), n=nextTier(cfg,c.s);
  const pct=n?Math.min(100,Math.round((c.s-t.from)/(n.from-t.from)*100)):100;
  const status = expired ? 'Срок действия бонусов истёк.' : bal>0
    ? (cfg.mode==='next'?'Можно потратить на ближайший визит':'Можно потратить на любую услугу')+(e?` · до ${fmtDate(e)}`:'')
    : 'Бонусов пока нет. Загляните в условия ниже.';
  return `<div class="panel">
    <div class="muted small">Привет, ${esc(c.n)}</div>
    <div><div class="balance">${eur(bal)}</div><div class="muted">${esc(status)}</div></div>
    ${c.d>0&&!expired?`<div><span class="pill">Скидка ${c.d}% на ближайший визит</span></div>`:''}
    <div><span class="pill">Кэшбэк ${t.pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="muted small">${n?`Потратьте ещё ${eur(n.from-c.s)}, и кэшбэк вырастет до ${n.pct}%`:'У вас максимальный кэшбэк'}</div></div>`;
}
function render(){
  if(!configured){ app.innerHTML='<div class="panel"><h2>Нужна настройка</h2><p class="muted">Откройте файл config.js и вставьте данные из Supabase.</p></div>'; return; }
  if(!cfg){ app.innerHTML=`<p class="muted">${err?esc(err):'Загрузка…'}</p>`; return; }
  const act=cfg.actions.filter(a=>a.val>0).map(a=>`<div><span>${esc(a.title)}</span><b>${reward(a)}</b></div>`).join('');
  const fr=cfg.friend&&cfg.friend.val>0?`<div><span>Приведи подругу: когда она придёт на первый визит и назовёт ваше имя</span><b>${reward(cfg.friend)}</b></div>`:'';
  const tiers=cfg.tiers.map((t,i,a)=>`<div><span>${i===a.length-1?`от ${eur(t.from)}`:(i===0?`до ${eur(a[i+1].from)}`:`${eur(t.from)} – ${eur(a[i+1].from)}`)} потрачено</span><b>${t.pct}%</b></div>`).join('');
  document.title=cfg.studio;
  app.innerHTML=`
  <header><div><h1>${esc(cfg.studio)}</h1>${cfg.tagline?`<p class="muted">${esc(cfg.tagline)}</p>`:''}</div></header>
  <div class="panel"><h2>Узнай свой баланс</h2>
    <form id="f" style="display:flex;flex-direction:column;gap:12px">
      <label for="q">Ваше имя или ник, как вас записала администратор<input id="q" value="${esc(q)}" autocomplete="off" placeholder="например, anna_lash"></label>
      <button class="primary" ${busy?'disabled':''}>${busy?'Ищем…':'Показать баланс'}</button>
      ${notFound?'<div class="neg small">Не нашли такое имя. Проверьте написание или спросите у администратора.</div>':''}
      ${err?`<div class="neg small">${esc(err)}</div>`:''}
    </form></div>
  ${result?card(result):''}
  <div class="panel"><h2>Как получить бонусы</h2><div class="ways">${fr}${act}</div>
    ${cfg.contact?`<p class="muted small">Чтобы засчитать бонус, отметьте нас или напишите: ${esc(cfg.contact)}</p>`:''}</div>
  <div class="panel"><h2>Кэшбэк с каждого визита</h2><div class="ways">${tiers}</div>
    <p class="muted small">Кэшбэк начисляется на ту часть визита, которую вы оплатили деньгами. Чем больше тратите, тем выше процент.</p></div>
  <div class="panel"><h2>Правила</h2>${rulesText(cfg).map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
  const inp=document.getElementById('q');
  document.getElementById('f').addEventListener('submit',e=>{ e.preventDefault(); q=inp.value; lookup(); });
}
async function lookup(){
  if(!norm(q)) return;
  busy=true; err=''; notFound=false; render();
  try{
    const {data,error}=await sb.rpc('get_balance',{p_login:q});
    if(error) throw error;
    result=data||null; notFound=!data;
    try{ localStorage.setItem('bonusQuery',q); }catch(e){}
  }catch(e){ err='Не удалось загрузить баланс. Попробуйте ещё раз.'; }
  busy=false; render();
}
(async()=>{
  render(); if(!sb) return;
  try{ const {data,error}=await sb.from('settings').select('cfg').eq('id',1).single(); if(error) throw error; cfg=data.cfg; }
  catch(e){ err='Не удалось загрузить страницу. Обновите её через минуту.'; }
  render(); if(cfg && q) lookup();
})();
</script>
</body>
</html>
