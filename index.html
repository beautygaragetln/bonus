<style>
/* iOS/Android: шрифт полей >=16px, иначе Safari приближает страницу при вводе и не возвращает */
input,select,textarea{font-size:16px!important;touch-action:manipulation}
button,a,label,summary{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

:root{
  --bg:#F3EDE7; --surface:#FBF8F5; --fg:#3E2C29; --muted:#74655F; --line:#E2D6CC;
  --accent:#713E4B; --accent-fg:#F3EDE7; --pink:#F2B7CC; --soft:#F7E3EA; --taupe:#B7A79F;
  --good:#3F7D5C; --bad:#A8403F;
  --display:'Bodoni Moda',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#241917; --surface:#3E2C29; --fg:#F3EDE7; --muted:#B7A79F; --line:#57433F;
  --accent:#F2B7CC; --accent-fg:#3E2C29; --soft:#4B3338;
  --good:#7FCFA3; --bad:#F08A86; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:20px max(16px,env(safe-area-inset-left,0px)) 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 30px/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font:600 21px/1.2 var(--display);margin:0}
h3{font:600 19px/1.2 var(--display);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:none;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.6;cursor:default}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:92px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .bal{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.pill.solid{background:var(--accent);color:var(--accent-fg)}
.balance{font:600 54px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--soft);padding:10px 12px;border-radius:10px;font-size:13px}
.hint.warn{background:var(--accent);color:var(--accent-fg)}
.ways{display:flex;flex-direction:column}
.ways div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ways div:first-child{border-top:0}
.ways b{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw}
.edit-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
/* Glam Levels */
.lv{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;flex:none;border:1px solid rgba(183,167,159,.55);gap:2px}
.lv svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lv small{font-size:8px;font-weight:700;letter-spacing:.1em}
.lv.big{width:84px;height:84px}.lv.big svg{width:34px;height:34px}.lv.big small{font-size:9px}
.lv.sm{width:40px;height:40px}.lv.sm svg{width:20px;height:20px}.lv.sm small{display:none}
.lv0{background:#F3EDE7;color:#3E2C29}
.lv1{background:#F2B7CC;color:#713E4B}
.lv2{background:#B7A79F;color:#3E2C29}
.lv3{background:#713E4B;color:#F2B7CC}
.lv4{background:#3E2C29;color:#F2B7CC}
.gl-head{display:flex;align-items:center;gap:16px}

.lrow:first-child{border-top:0}
.lrow .lt{display:flex;flex-direction:column;flex:1;min-width:0}
.lrow .lt b{font:600 17px var(--display);letter-spacing:.02em;text-transform:uppercase}
.lrow .lt span{font-size:13px;color:var(--muted)}
.lbadge{font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.lrow.current{background:var(--soft);border-radius:14px;padding:14px 12px;margin:2px -12px;width:calc(100% + 24px);border-top-color:transparent}
.lrow.current .lbadge{color:var(--accent)}
.lrow.passed .lbadge{color:var(--good)}
.lrow.locked .lv{opacity:.45;filter:grayscale(.4)}

.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.sheet-bg,.sheet{overscroll-behavior:contain}

.perks div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.perks div:first-child{border-top:0}
.perks b{text-align:right}
ul.plain{margin:6px 0 0;padding-left:18px}

/* v3: Beauty Garage Club */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .eyebrow{letter-spacing:.18em}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.langs button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}

h1,.it{font-style:normal}
.hero-card{background:#713E4B;color:#F3EDE7;border-radius:20px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:6px}

.hc-level{font:italic 600 34px/1.1 var(--display);margin-top:6px}
.hc-sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}

.hc-label{font-size:14px;opacity:.9}

.hc-note{font-size:13px;opacity:.85}
.hc-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hc-chips .pill{background:rgba(243,237,231,.16);color:#F3EDE7}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rowline b{font-weight:700}
.block{display:flex;flex-direction:column;gap:8px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.callout b{color:var(--accent);font:italic 600 17px var(--display)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:center}
.tile svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.journey-title{font:italic 600 26px/1.15 var(--display);text-align:center}
.ladder.cards{gap:10px}
.ladder.cards .lrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;width:100%}
.ladder.cards .lrow.current{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ladder.cards .lrow .lv{width:48px;height:48px}.ladder.cards .lrow .lv small{display:none}.ladder.cards .lrow .lv svg{width:22px;height:22px}
.ladder.cards .lrow .lt b{font:600 15px var(--body);letter-spacing:.04em}
.lbadge svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.lbadge .you{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:3px 10px;font-size:12px}
.ladder-wrap{display:flex;flex-direction:column;gap:12px;background:none;border:0;padding:0}
.sheet.center .lv.big{margin-top:4px}
.spark{position:relative;display:inline-flex}
.sheet h3{font-style:italic}
.confetti{font-style:italic}
.visit-list div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.visit-list div:first-child{border-top:0}

/* v4: аккаунт и запись */
.cta{flex-direction:row;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cta button{min-width:150px}
.acct .rowline{align-items:center}
.svc-list{display:grid;gap:10px}
.svc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:14px}
.svc small{color:var(--muted);font-weight:500}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-head button{width:40px;height:40px;padding:0;border-radius:50%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.cal button{padding:0;aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:none;font-weight:600;font-variant-numeric:tabular-nums}
.cal button.has{background:var(--soft);color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-fg)}
.cal button:disabled{opacity:.28;cursor:default}
.chips-t{display:flex;flex-wrap:wrap;gap:8px}
.tchip{padding:9px 14px;border-radius:99px;font-variant-numeric:tabular-nums}
.tchip.auto{border-color:var(--accent)}
.tchip.req{border-style:dashed;border-color:var(--accent)}
.tchip.sel{background:var(--accent);color:var(--accent-fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.bk-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.bk-row:first-child{border-top:0;padding-top:0}
.pill.dash{background:transparent;border:1px dashed var(--accent)}

.install{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--soft)}
.install .x{border:0;background:none;color:var(--muted);padding:6px 10px}
.steps{display:grid;gap:10px;padding-left:20px}
.steps li{padding-left:4px}
.prefs{display:grid;gap:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D33A4E;margin-left:8px;vertical-align:middle;box-shadow:0 0 0 3px rgba(211,58,78,.18)}
.notice{border-left:4px solid #D33A4E;gap:10px}
.notice .eyebrow{display:flex;align-items:center;gap:6px}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>

<script>
const r2 = n => Math.round(n*100)/100;
let LOCALE='ru-RU';
const eur = n => r2(n).toLocaleString(LOCALE,{minimumFractionDigits:Number.isInteger(r2(n))?0:2,maximumFractionDigits:2})+' €';
const tk=k=>'\u0001'+k; /* ошибка хранится как ключ и переводится при каждой отрисовке: язык можно менять, пока она на экране */
const esc = s => String(s??'').replace(/\u0001(\w+)/g,(m0,k)=>t(k)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString(LOCALE,{day:'numeric',month:'long'});
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/^@+/,'').replace(/\s+/g,' ').trim();
function hash(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const keyOf = s => hash(norm(s),0)+hash(norm(s),7);
const DAY = 864e5;
const reward = a => a.type==='pct' ? `скидка ${a.val}%` : `+${r2(a.val)} €`;
const tierFor = (cfg,spent) => cfg.tiers.reduce((t,x)=>spent>=x.from?x:t, cfg.tiers[0]);
const nextTier = (cfg,spent) => cfg.tiers.find(x=>x.from>spent);
function rulesText(cfg){
  const t=[];
  t.push(cfg.mode==='next' ? 'Бонусы действуют на ближайший визит. Что не потратили — сгорает.' : 'Бонусы копятся, и тратить их можно в любой момент и в любой сумме.');
  if(cfg.expireDays>0) t.push(`Срок действия — ${cfg.expireDays} дн. с последнего начисления.`);
  if(cfg.maxPct<100) t.push(`Бонусами можно оплатить до ${cfg.maxPct}% стоимости визита.`);
  return t;
}

/* ---------- Glam Levels ---------- */
const DEFAULT_GLAM = {
  enabled:false, remindDays:60, warnDays:80, downDays:90, recoverDays:60,
  levels:[
    {name:'Baby Glam',from:0,cashback:3,discount:0,birthday:5,levelBonus:0,priority:false,firstTattoo:0,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:0},
    {name:'Glam Girl',from:80,cashback:4,discount:2,birthday:7,levelBonus:5,priority:false,firstTattoo:10,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:30},
    {name:'It Girl',from:200,cashback:5,discount:3,birthday:10,levelBonus:10,priority:false,firstTattoo:15,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:60},
    {name:'Baddie',from:400,cashback:6,discount:5,birthday:15,levelBonus:15,priority:true,firstTattoo:20,giftsPerYear:1,gifts:['Бесплатное оформление бровей','Скидка 50% на макияж','25 € на татуировку','Скидка 50% на ламинирование ресниц или бровей'],giftsEn:['Free brow shaping','50% off makeup','€25 off a tattoo','50% off lash or brow lamination'],giftsEt:['Tasuta kulmukujundus','50% allahindlus meigile','25 € allahindlus tätoveeringule','50% allahindlus ripsmete või kulmude laminatsioonile'],recoverAmount:120},
    {name:'Super Baddie',from:700,cashback:7,discount:7,birthday:20,levelBonus:25,priority:true,firstTattoo:25,giftsPerYear:2,gifts:['Бесплатный макияж','Бесплатное ламинирование бровей','Бесплатное ламинирование ресниц','50 € на татуировку','50 € на курс «Макияж для себя»'],giftsEn:['Free makeup','Free brow lamination','Free lash lamination','€50 off a tattoo','€50 off the “Makeup for Yourself” course'],giftsEt:['Tasuta meik','Tasuta kulmude laminatsioon','Tasuta ripsmete laminatsioon','50 € allahindlus tätoveeringule','50 € allahindlus kursusele „Meik endale“'],recoverAmount:200}
  ]
};
function mergeGlam(g){
  const d=JSON.parse(JSON.stringify(DEFAULT_GLAM));
  if(!g||!Array.isArray(g.levels)||g.levels.length!==5) return d;
  const out={...d,...g}; out.levels=g.levels.map((l,i)=>({...d.levels[i],...l})); return out;
}
/* Визиты клиентки из истории. Старые записи без деталей добираются из суммы трат. */
function visitsOf(c){
  const h=c.history||[];
  const v=h.filter(e=>e.kind==='visit'&&((e.amount||0)>0||(e.paid||0)>0)).map(e=>({ts:e.ts,paid:e.paid||0}));
  const rem=r2((c.spent||0)-v.reduce((s,x)=>s+x.paid,0));
  if(rem>0.5) v.push({ts:h.length?Math.min(...h.map(e=>e.ts)):(c.createdAt||Date.now()),paid:rem});
  return v.sort((a,b)=>a.ts-b.ts);
}
/* Уровень считается по «квалификационным тратам» q. Визит увеличивает q.
   Понижение за неактивность сбрасывает q до порога нового уровня, поэтому прежняя сумма трат
   сама по себе уровень не возвращает. Потерянный уровень можно вернуть, потратив recoverAmount за recoverDays. */
function glamCompute(G,visits,now){
  const L=G.levels, D=G.downDays*DAY, R=G.recoverDays*DAY;

    if(data.error){ bk.err=errMsg(data.error); if(['busy','not_available','too_soon'].includes(data.error)){ delete bk.slots[slotKey()]; bk.step=2; bk.time=null; bk.busy=false; await loadMonth(); return; } }
    else { rec=data; bk.done=data.booking; bk.step=4; seenMark([data.booking.id]); }
  }catch(e){ bk.err=tk('e_net'); }
  bk.busy=false; render();
}
function bindBooking(){
  document.querySelectorAll('[data-svc]').forEach(b=>b.onclick=()=>{ bk.service=b.dataset.svc; bk.step=2; bk.date=null; bk.time=null; bk.month=ym(new Date()); bk.err=''; render(); loadMonth(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ bk.date=b.dataset.day; bk.time=null; render(); });
  document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ bk.time=b.dataset.time; render(); });
  document.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{ const a=b.dataset.bk;
    if(a==='prev') shiftMonth(-1); else if(a==='next') shiftMonth(1);
    else if(a==='step3'){ bk.step=3; bk.err=''; render(); }
    else if(a==='back'){ bk.step=Math.max(1,bk.step-1); bk.err=''; render(); }
    else if(a==='confirm'){ const n=document.getElementById('bkNote'); if(n) bk.note=n.value; confirmBooking(); } });
  document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{ if(b.dataset.cx==='keep'){ sheet=null; render(); } else doCancel(); });
  const pf=document.getElementById('pfForm'); if(pf){ pf.addEventListener('submit',e=>{ e.preventDefault(); if(val('pfEmail')&&!EMAIL_RE.test(val('pfEmail'))) return; saveProfile(); }); const pe=document.getElementById('pfEmail'); pe.addEventListener('input',syncProfile); syncProfile(); }
}
function cancelSheet(){
  const b=(rec.bookings||[]).find(x=>x.id===sheet.id); if(!b) return '';
  const hrs=(b.start-Date.now())/3600000, ch=+BK().cancelHours||24, fee=+BK().lateFee||0; let msg,cls='';
  if(b.status==='pending'||hrs>=ch) msg=t('cxFree'); else if(rec.freeLeft>0) msg=t('cxFreePass',rec.freeLeft,rec.freeLeft-1); else { msg=t('cxLate',eur(fee)); cls='warn'; }
  return shell(`<h3>${esc(t('cxTitle'))}</h3><p>${esc(dayLabel(b.ld))}, ${b.lt}–${b.le} · ${esc(svcName(b.service))}</p><div class="hint ${cls}">${esc(msg)}</div>
    ${sheet.err?`<div class="neg small">${esc(sheet.err)}</div>`:''}
    <div class="actions"><button data-cx="keep">${esc(t('cxKeep'))}</button><button class="primary" data-cx="do" ${sheet.busy?'disabled':''}>${esc(t('cxDo'))}</button></div>`);
}
async function doCancel(){
  const id=sheet.id; sheet.busy=true; sheet.err=''; render();

    const data=await rpc('cancel_booking',{p_login:cred.login,p_pin:cred.pin,p_id:id});

    const b=(data.bookings||[]).find(x=>x.id===id);

  }catch(e){ sheet.err=tk('e_net'); sheet.busy=false; }
  render();
}

    <label>${esc(t('pfEmail'))}<input id="pfEmail" type="email" autocapitalize="none" spellcheck="false" value="${esc(rec.email||'')}"></label>

    <label class="check"><input type="checkbox" id="pfMkt" ${(rec.marketing&&EMAIL_RE.test(rec.email||''))?'checked':''} ${EMAIL_RE.test(rec.email||'')?'':'disabled'}><span>${esc(t('pfMkt'))}</span></label>

async function saveProfile(){
  const np=document.getElementById('pfPin').value, args={p_login:cred.login,p_pin:cred.pin,p_email:val('pfEmail'),p_marketing:document.getElementById('pfMkt').checked,p_birthday:val('pfBday'),p_new_pin:np,p_phone:val('pfPhone')};
  try{
    const data=await rpc('client_update',args);

    else { rec=data; if(np){ cred.pin=np; saveCred(); } sheet={type:'profile',err:'',msg:tk('pfSaved')}; }
  }catch(e){ sheet.err=tk('e_net'); }
  render();

function downloadIcs(id){
  const b=(rec.bookings||[]).find(x=>x.id===id); if(!b) return;
  const f=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const x=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Beauty Garage//EN','BEGIN:VEVENT',`UID:${b.id}@beautygarage`,`DTSTAMP:${f(Date.now())}`,`DTSTART:${f(b.start)}`,`DTEND:${f(b.end)}`,
    `SUMMARY:${x(svcName(b.service)+' · '+cfg.studio)}`,`DESCRIPTION:${x(b.status==='pending'?t('stPending'):t('stConfirmed'))}`,`STATUS:${b.status==='pending'?'TENTATIVE':'CONFIRMED'}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})), a=document.createElement('a');
  a.href=url; a.download='beauty-garage.ics'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
/* ---------- обновления по записям: красная точка, баннер, значок на иконке ---------- */
const seenKey=()=>'bgSeen:'+(rec?rec.login:'');
const seenGet=()=>{ try{ return JSON.parse(localStorage.getItem(seenKey())||'null'); }catch(e){ return null; } };
const seenSet=m=>{ try{ localStorage.setItem(seenKey(),JSON.stringify(m)); }catch(e){} };
function seenSeed(){ if(!rec||seenGet()) return; const m={}; (rec.bookings||[]).forEach(b=>{ m[b.id]=b.status; }); seenSet(m); }
function seenMark(ids){ if(!rec) return; const m=seenGet()||{}; (rec.bookings||[]).forEach(b=>{ if(!ids||ids.includes(b.id)) m[b.id]=b.status; }); seenSet(m); }
function notices(){
  if(!rec) return [];
  const m=seenGet(); if(!m) return [];
  const out=[], now=Date.now();
  (rec.bookings||[]).forEach(b=>{
    const prev=m[b.id]; if(prev===b.status) return;
    if(b.status==='declined') out.push({b,kind:'declined'});
    else if(b.status==='cancelled'&&b.end>now-7*864e5) out.push({b,kind:'cancelled'});
    else if(b.status==='confirmed'&&prev==='pending') out.push({b,kind:'confirmed'});
  });
  return out.sort((a,b)=>b.b.start-a.b.start);
}
function updateBadge(){
  try{ const n=notices().length; if(n&&navigator.setAppBadge) navigator.setAppBadge(n); else if(!n&&navigator.clearAppBadge) navigator.clearAppBadge(); }catch(e){}
}
function noticePanel(){
  const ns=notices(); if(!ns.length) return '';
  const msg={declined:'nDeclined',cancelled:'nCancelled',confirmed:'nConfirmed'};
  return `<div class="panel notice" role="status"><div class="eyebrow"><span class="dot" style="margin:0"></span>${esc(t('nTitle'))}</div>
    ${ns.map(({b,kind})=>`<div class="bk-row"><div><b>${esc(t(msg[kind],dayLabel(b.ld)+', '+b.lt))}</b><div class="muted small">${esc(svcName(b.service))}</div>${b.admin_note&&kind!=='confirmed'?`<div class="small">${esc(t('nComment'))} ${esc(b.admin_note)}</div>`:(b.admin_note?`<div class="small">${esc(b.admin_note)}</div>`:'')}</div>
      <div class="actions">${kind!=='confirmed'?`<button data-act="book">${esc(t('nAnother'))}</button>`:''}<button class="primary" data-act="seen" data-id="${b.id}">${esc(t('nOk'))}</button></div></div>`).join('')}</div>`;
}
/* ---------- обновление данных на открытой странице ---------- */
let refreshing=false;
async function refreshRec(){
  if(refreshing||!rec||!cred||!cred.pin||busy) return;
  if(sheet&&(sheet.type==='book'||sheet.type==='profile')) return;
  const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  refreshing=true;
  try{
    const data=await rpc('client_login',{p_login:cred.login,p_pin:cred.pin});
    if(data&&!data.error){
      const sig=r=>JSON.stringify((r.bookings||[]).map(b=>[b.id,b.status,b.start]))+r.b+'|'+r.level;
      const changed=sig(data)!==sig(rec); rec=data;
      if(changed){ updateBadge(); render(); }
    }
  }catch(e){}
  refreshing=false;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshRec(); });
window.addEventListener('focus',refreshRec);
window.addEventListener('pageshow',refreshRec);
setInterval(()=>{ if(!document.hidden) refreshRec(); },60000);
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='push') refreshRec(); });

/* ---------- установка (PWA) и push ---------- */
const isStandalone=()=>{ try{ return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; }catch(e){ return false; } };
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushSupported=()=>('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
const pushVisible=()=>{ let t=false; try{ t=/[?&]push=1/.test(location.search); if(t) localStorage.setItem('bgPushTest','1'); else t=localStorage.getItem('bgPushTest')==='1'; }catch(e){} return !!(pushCfg&&pushCfg.key&&(pushCfg.show||t)); };
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(typeof render==='function'&&cfg) render(); });
window.addEventListener('appinstalled',()=>{ installEvt=null; render(); });
function installPanel(){
  let hide=false; try{ hide=localStorage.getItem('bgInstallHide')==='1'; }catch(e){}
  if(isStandalone()||!cfg||!(isIOS()||/Android/i.test(navigator.userAgent))) return '';
  if(hide) return `<div style="text-align:center"><button class="ghost" data-act="install">${esc(t('insLink'))}</button></div>`;
  return `<div class="panel install"><div><b>${esc(t('insTitle'))}</b><div class="muted small">${esc(t('insSub'))}</div></div>
    <div class="actions"><button data-act="install" class="primary">${esc(t('insBtn'))}</button><button class="x" data-act="insHide" aria-label="${esc(t('insHide'))}">×</button></div></div>`;
}
function installSheet(){
  const ios=isIOS(), L=ios?T[lang].insIos:T[lang].insAnd;
  return shell(`<h3>${esc(ios?t('insIosT'):t('insAndT'))}</h3><ol class="steps">${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    ${ios?`<p class="muted small">${esc(t('insIosNote'))}</p>`:''}
    ${(!ios&&installEvt)?`<button class="primary" data-act="nativeInstall">${esc(t('insNative'))}</button>`:''}
    <button class="ghost" data-close="1" id="sheetClose">${esc(t('close'))}</button>`);
}
function notifyPanel(){
  if(!rec||!pushVisible()) return '';
  try{ if(typeof Notification!=='undefined') lastPerm=Notification.permission; }catch(e){}
  const head=`<h2>${esc(t('pnTitle'))}</h2><p class="muted small">${esc(t('pnWhat'))}</p>`;
  const wrap=x=>`<div class="panel">${head}${x}${pushSt.msg?`<div class="small ${pushSt.err?'neg':'pos'}">${esc(pushSt.msg)}</div>`:''}</div>`;
  if(isIOS()&&!isStandalone()) return wrap(`<p>${esc(t('pnNeedInstall'))}</p><button data-act="install">${esc(t('insBtn'))}</button>`);
  if(!pushSupported()) return wrap(`<p class="muted">${esc(t('pnUnsupported'))}</p>`);
  if(Notification.permission==='denied') return wrap(`<p class="neg small">${esc(t('pnDenied'))}</p><button data-act="pnRecheck">${esc(t('pnRecheck'))}</button>`);
  if(!pushSt.sub) return wrap(`<button class="primary" data-act="pushOn" ${pushSt.busy?'disabled':''}>${esc(pushSt.busy?t('wait'):t('pnOn'))}</button>`);
  const p=pushSt.prefs||{};
  const row=(k,lab)=>`<label class="check"><input type="checkbox" data-pref="${k}" ${p[k]?'checked':''}><span>${esc(t(lab))}</span></label>`;
  return wrap(`<p class="pos small">${esc(t('pnEnabled'))}</p><div class="prefs">${row('booking','pnBooking')}${row('bonus','pnBonus')}${row('level','pnLevel')}${row('birthday','pnBirthday')}${row('promo','pnPromo')}</div>
    <button class="ghost" data-act="pushOff">${esc(t('pnOff'))}</button>`);
}
const b64u=k=>{ const p='='.repeat((4-k.length%4)%4), b=atob((k+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); };
async function swReg(){ try{ return await navigator.serviceWorker.ready; }catch(e){ return null; } }
async function pushRefresh(){
  if(!rec||!cred||!pushVisible()||!pushSupported()||(isIOS()&&!isStandalone())){ return; }
  try{
    const reg=await swReg(); if(!reg) return;
    const sub=await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){
      const k=sub.toJSON().keys||{};
      const r=await rpc('push_subscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint,p_p256dh:k.p256dh,p_auth:k.auth,p_ua:navigator.userAgent,p_lang:lang});
      pushSt.sub=!!r.ok; pushSt.prefs=r.prefs||null;
    } else pushSt.sub=false;
    pushSt.checked=true;
  }catch(e){}
  render();
}
async function pushOn(){
  pushSt.busy=true; pushSt.msg=''; pushSt.err=false; render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ pushSt.busy=false; if(perm==='default'){ pushSt.msg=tk('pnDismissed'); pushSt.err=false; } render(); return; }
    const reg=await swReg();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pushCfg.key)});
    const k=sub.toJSON().keys||{};
    const r=await rpc('push_subscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint,p_p256dh:k.p256dh,p_auth:k.auth,p_ua:navigator.userAgent,p_lang:lang});
    if(!r.ok){ await sub.unsubscribe(); throw new Error(r.error||'x'); }
    pushSt.sub=true; pushSt.prefs=r.prefs; pushSt.msg='';
  }catch(e){ pushSt.msg=tk('pnFail'); pushSt.err=true; }
  pushSt.busy=false; render();
}
async function pushOff(){
  try{
    const reg=await swReg(), sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ await rpc('push_unsubscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint}); await sub.unsubscribe(); }
  }catch(e){}
  pushSt.sub=false; pushSt.msg=''; render();
}
let lastPerm=(typeof Notification!=='undefined')?Notification.permission:'';
function permWatch(){ if(typeof Notification==='undefined') return; if(Notification.permission!==lastPerm){ lastPerm=Notification.permission; pushSt.msg=''; render(); pushRefresh(); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) permWatch(); });
window.addEventListener('focus',permWatch);
try{ if(navigator.permissions&&navigator.permissions.query) navigator.permissions.query({name:'notifications'}).then(ps=>{ ps.onchange=permWatch; }).catch(()=>{}); }catch(e){}
function pushDropDevice(){
  if(!pushSt.sub||!cred||!pushSupported()) return;
  const c={...cred};
  navigator.serviceWorker.ready.then(reg=>reg.pushManager.getSubscription().then(sub=>{ if(sub){ rpc('push_unsubscribe',{p_login:c.login,p_pin:c.pin,p_endpoint:sub.endpoint}).catch(()=>{}); sub.unsubscribe(); } })).catch(()=>{});
}
async function savePrefs(){
  const p={}; document.querySelectorAll('[data-pref]').forEach(el=>{ p[el.dataset.pref]=el.checked; });
  try{ const r=await rpc('push_set_prefs',{p_login:cred.login,p_pin:cred.pin,p_prefs:p}); if(r.ok){ pushSt.prefs=r.prefs; pushSt.msg=tk('pnSaved'); pushSt.err=false; } }catch(e){ pushSt.msg=tk('e_net'); pushSt.err=true; }
  render();
}
function bindPush(){
  document.querySelectorAll('[data-act]').forEach(b=>{ const a=b.dataset.act;
    if(a==='install') b.onclick=()=>{ sheet={type:'install'}; render(); };
    else if(a==='insHide') b.onclick=()=>{ try{ localStorage.setItem('bgInstallHide','1'); }catch(e){} render(); };
    else if(a==='nativeInstall') b.onclick=async()=>{ if(installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; sheet=null; render(); } };
    else if(a==='seen') b.onclick=()=>{ seenMark([b.dataset.id]); updateBadge(); render(); };
    else if(a==='pnRecheck') b.onclick=()=>{ pushSt.msg=''; render(); pushRefresh(); };
    else if(a==='pushOn') b.onclick=pushOn;
    else if(a==='pushOff') b.onclick=pushOff; });
  document.querySelectorAll('[data-pref]').forEach(el=>el.onchange=savePrefs);
}
(async()=>{
  if(!window.GC_TEXTS){ document.getElementById('app').innerHTML='<div class="panel"><h2>Beauty Garage</h2><p>Не найден файл texts.js. Загрузите его в репозиторий рядом с index.html.</p></div>'; return; }
  render(); if(!sb) return;

  catch(e){ err=tk('loadErr'); }
  try{ const pc=await rpc('push_config',{}); pushCfg=pc; }catch(e){}
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  render(); if(cfg&&cred&&cred.pin) await doLogin(cred.login,cred.pin,true);
})();
