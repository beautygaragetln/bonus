<style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const r2 = n => Math.round(n*100)/100;
let LOCALE='ru-RU';
const eur = n => r2(n).toLocaleString(LOCALE,{minimumFractionDigits:Number.isInteger(r2(n))?0:2,maximumFractionDigits:2})+' €';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString(LOCALE,{day:'numeric',month:'long'});
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/^@+/,'').replace(/\s+/g,' ').trim();
function hash(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const keyOf = s => hash(norm(s),0)+hash(norm(s),7);
const DAY = 864e5;
const reward = a => a.type==='pct' ? `скидка ${a.val}%` : `+${r2(a.val)} €`;
const tierFor = (cfg,spent) => cfg.tiers.reduce((t,x)=>spent>=x.from?x:t, cfg.tiers[0]);
const nextTier = (cfg,spent) => cfg.tiers.find(x=>x.from>spent);
function rulesText(cfg){
  const t=[];
  t.push(cfg.mode==='next' ? 'Бонусы действуют на ближайший визит. Что не потратили — сгорает.' : 'Бонусы копятся, и тратить их можно в любой момент и в любой сумме.');
  if(cfg.expireDays>0) t.push(`Срок действия — ${cfg.expireDays} дн. с последнего начисления.`);
  if(cfg.maxPct<100) t.push(`Бонусами можно оплатить до ${cfg.maxPct}% стоимости визита.`);
  return t;
}

/* ---------- Glam Levels ---------- */
const DEFAULT_GLAM = {
  enabled:false, remindDays:60, warnDays:80, downDays:90, recoverDays:60,
  levels:[
    {name:'Baby Glam',from:0,cashback:3,discount:0,birthday:5,levelBonus:0,priority:false,firstTattoo:0,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:0},
    {name:'Glam Girl',from:80,cashback:4,discount:2,birthday:7,levelBonus:5,priority:false,firstTattoo:10,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:30},
    {name:'It Girl',from:200,cashback:5,discount:3,birthday:10,levelBonus:10,priority:false,firstTattoo:15,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:60},
    {name:'Baddie',from:400,cashback:6,discount:5,birthday:15,levelBonus:15,priority:true,firstTattoo:20,giftsPerYear:1,gifts:['Бесплатное оформление бровей','Скидка 50% на макияж','25 € на татуировку','Скидка 50% на ламинирование ресниц или бровей'],giftsEn:['Free brow shaping','50% off makeup','€25 off a tattoo','50% off lash or brow lamination'],giftsEt:['Tasuta kulmukujundus','50% allahindlus meigile','25 € allahindlus tätoveeringule','50% allahindlus ripsmete või kulmude laminatsioonile'],recoverAmount:120},
    {name:'Super Baddie',from:700,cashback:7,discount:7,birthday:20,levelBonus:25,priority:true,firstTattoo:25,giftsPerYear:2,gifts:['Бесплатный макияж','Бесплатное ламинирование бровей','Бесплатное ламинирование ресниц','50 € на татуировку','50 € на курс «Макияж для себя»'],giftsEn:['Free makeup','Free brow lamination','Free lash lamination','€50 off a tattoo','€50 off the “Makeup for Yourself” course'],giftsEt:['Tasuta meik','Tasuta kulmude laminatsioon','Tasuta ripsmete laminatsioon','50 € allahindlus tätoveeringule','50 € allahindlus kursusele „Meik endale“'],recoverAmount:200}
  ]
};
function mergeGlam(g){
  const d=JSON.parse(JSON.stringify(DEFAULT_GLAM));
  if(!g||!Array.isArray(g.levels)||g.levels.length!==5) return d;
  const out={...d,...g}; out.levels=g.levels.map((l,i)=>({...d.levels[i],...l})); return out;
}
/* Визиты клиентки из истории. Старые записи без деталей добираются из суммы трат. */
function visitsOf(c){
  const h=c.history||[];
  const v=h.filter(e=>e.kind==='visit'&&((e.amount||0)>0||(e.paid||0)>0)).map(e=>({ts:e.ts,paid:e.paid||0}));
  const rem=r2((c.spent||0)-v.reduce((s,x)=>s+x.paid,0));
  if(rem>0.5) v.push({ts:h.length?Math.min(...h.map(e=>e.ts)):(c.createdAt||Date.now()),paid:rem});
  return v.sort((a,b)=>a.ts-b.ts);
}
/* Уровень считается по «квалификационным тратам» q. Визит увеличивает q.
   Понижение за неактивность сбрасывает q до порога нового уровня, поэтому прежняя сумма трат
   сама по себе уровень не возвращает. Потерянный уровень можно вернуть, потратив recoverAmount за recoverDays. */
function glamCompute(G,visits,now){
  const L=G.levels, D=G.downDays*DAY, R=G.recoverDays*DAY;
  const lvOf=q=>{let l=0;L.forEach((x,i)=>{if(q>=x.from)l=i});return l};
  const gi=L.findIndex(x=>x.giftsPerYear>0);
  let q=0,last=null,lost=null,total=0,anchor=null;const log=[];
  const demote=upTo=>{let k=0;
    while(last!=null && last+(k+1)*D<=upTo){k++;const t=last+k*D,l=lvOf(q);
      if(l>0){lost={level:(lost&&t-lost.at<=R)?Math.max(lost.level,l):l,at:t,spent:0};q=L[l-1].from;log.push({ts:t,type:'down',from:l,to:l-1});}}
    return k;};
  const mark=ts=>{if(anchor==null&&gi>=0&&lvOf(q)>=gi)anchor=ts;};
  for(const v of visits){
    demote(v.ts);

  if(gc.downs>0&&gc.log.some(x=>x.type==='down'&&x.ts>=gc.last)) call+=`<div class="callout"><span>${esc(t('demoted'))}</span></div>`;
  if(gc.lost) call+=`<div class="callout"><span>${esc(t('lost',L[gc.lost.level].name,eur(gc.lost.need),fmtDate(gc.lost.until)))}</span></div>`;

function notices(){
  if(!rec) return [];
  const m=seenGet(); if(!m) return [];
  const out=[], now=Date.now();
  (rec.bookings||[]).forEach(b=>{
    const prev=m[b.id]; if(prev===b.status) return;
    if(b.status==='declined') out.push({b,kind:'declined'});
    else if(b.status==='cancelled'&&b.end>now-7*864e5) out.push({b,kind:'cancelled'});

}

}
function notifyPanel(){
  if(!rec||!pushVisible()) return '';
  const head=`<h2>${esc(t('pnTitle'))}</h2><p class="muted small">${esc(t('pnWhat'))}</p>`;
  const wrap=x=>`<div class="panel">${head}${x}${pushSt.msg?`<div class="small ${pushSt.err?'neg':'pos'}">${esc(pushSt.msg)}</div>`:''}</div>`;
  if(isIOS()&&!isStandalone()) return wrap(`<p>${esc(t('pnNeedInstall'))}</p><button data-act="install">${esc(t('insBtn'))}</button>`);
  if(!pushSupported()) return wrap(`<p class="muted">${esc(t('pnUnsupported'))}</p>`);
  if(Notification.permission==='denied') return wrap(`<p class="neg small">${esc(t('pnDenied'))}</p>`);
  if(!pushSt.sub) return wrap(`<button class="primary" data-act="pushOn" ${pushSt.busy?'disabled':''}>${esc(pushSt.busy?t('wait'):t('pnOn'))}</button>`);
  const p=pushSt.prefs||{};
  const row=(k,lab)=>`<label class="check"><input type="checkbox" data-pref="${k}" ${p[k]?'checked':''}><span>${esc(t(lab))}</span></label>`;
  return wrap(`<p class="pos small">${esc(t('pnEnabled'))}</p><div class="prefs">${row('booking','pnBooking')}${row('bonus','pnBonus')}${row('level','pnLevel')}${row('birthday','pnBirthday')}${row('promo','pnPromo')}</div>
    <button class="ghost" data-act="pushOff">${esc(t('pnOff'))}</button>`);
}
const b64u=k=>{ const p='='.repeat((4-k.length%4)%4), b=atob((k+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); };
async function swReg(){ try{ return await navigator.serviceWorker.ready; }catch(e){ return null; } }
async function pushRefresh(){
  if(!rec||!cred||!pushVisible()||!pushSupported()||(isIOS()&&!isStandalone())){ return; }
  try{
    const reg=await swReg(); if(!reg) return;
    const sub=await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){
      const k=sub.toJSON().keys||{};
      const r=await rpc('push_subscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint,p_p256dh:k.p256dh,p_auth:k.auth,p_ua:navigator.userAgent,p_lang:lang});
      pushSt.sub=!!r.ok; pushSt.prefs=r.prefs||null;
    } else pushSt.sub=false;
    pushSt.checked=true;
  }catch(e){}
  render();
}
async function pushOn(){
  pushSt.busy=true; pushSt.msg=''; pushSt.err=false; render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ pushSt.busy=false; render(); return; }
    const reg=await swReg();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pushCfg.key)});
    const k=sub.toJSON().keys||{};
    const r=await rpc('push_subscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint,p_p256dh:k.p256dh,p_auth:k.auth,p_ua:navigator.userAgent,p_lang:lang});
    if(!r.ok){ await sub.unsubscribe(); throw new Error(r.error||'x'); }
    pushSt.sub=true; pushSt.prefs=r.prefs; pushSt.msg='';
  }catch(e){ pushSt.msg=t('pnFail'); pushSt.err=true; }
  pushSt.busy=false; render();
}
async function pushOff(){
  try{
    const reg=await swReg(), sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ await rpc('push_unsubscribe',{p_login:cred.login,p_pin:cred.pin,p_endpoint:sub.endpoint}); await sub.unsubscribe(); }
  }catch(e){}
  pushSt.sub=false; pushSt.msg=''; render();
}
function pushDropDevice(){
  if(!pushSt.sub||!cred||!pushSupported()) return;
  const c={...cred};
  navigator.serviceWorker.ready.then(reg=>reg.pushManager.getSubscription().then(sub=>{ if(sub){ rpc('push_unsubscribe',{p_login:c.login,p_pin:c.pin,p_endpoint:sub.endpoint}).catch(()=>{}); sub.unsubscribe(); } })).catch(()=>{});
}
async function savePrefs(){
  const p={}; document.querySelectorAll('[data-pref]').forEach(el=>{ p[el.dataset.pref]=el.checked; });
  try{ const r=await rpc('push_set_prefs',{p_login:cred.login,p_pin:cred.pin,p_prefs:p}); if(r.ok){ pushSt.prefs=r.prefs; pushSt.msg=t('pnSaved'); pushSt.err=false; } }catch(e){ pushSt.msg=t('e_net'); pushSt.err=true; }
  render();
}
function bindPush(){
  document.querySelectorAll('[data-act]').forEach(b=>{ const a=b.dataset.act;
    if(a==='install') b.onclick=()=>{ sheet={type:'install'}; render(); };
    else if(a==='insHide') b.onclick=()=>{ try{ localStorage.setItem('bgInstallHide','1'); }catch(e){} render(); };
    else if(a==='nativeInstall') b.onclick=async()=>{ if(installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; sheet=null; render(); } };
    else if(a==='seen') b.onclick=()=>{ seenMark([b.dataset.id]); updateBadge(); render(); };
    else if(a==='pushOn') b.onclick=pushOn;
    else if(a==='pushOff') b.onclick=pushOff; });
  document.querySelectorAll('[data-pref]').forEach(el=>el.onchange=savePrefs);
}
(async()=>{
  render(); if(!sb) return;
  try{ const {data,error}=await sb.from('settings').select('cfg').eq('id',1).single(); if(error) throw error; cfg=data.cfg; cfg.glam=mergeGlam(cfg.glam); }
  catch(e){ err=t('loadErr'); }
  try{ const pc=await rpc('push_config',{}); pushCfg=pc; }catch(e){}
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  render(); if(cfg&&cred&&cred.pin) await doLogin(cred.login,cred.pin,true);
})();
</script>
