<style>

.block{display:flex;flex-direction:column;gap:8px}

.sheet.center .lv.big{margin-top:4px}
.spark{position:relative;display:inline-flex}

.confetti{font-style:italic}
.visit-list div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.visit-list div:first-child{border-top:0}

<script>
const r2 = n => Math.round(n*100)/100;

const DEFAULT_GLAM = {

    {name:'It Girl',from:200,cashback:5,discount:3,birthday:10,levelBonus:10,priority:false,firstTattoo:15,giftsPerYear:0,gifts:[],giftsEn:[],recoverAmount:60},
    {name:'Baddie',from:400,cashback:6,discount:5,birthday:15,levelBonus:15,priority:true,firstTattoo:20,giftsPerYear:1,gifts:['Бесплатное оформление бровей','Скидка 50% на макияж','25 € на татуировку','Скидка 50% на ламинирование ресниц или бровей'],giftsEn:['Free brow shaping','50% off makeup','€25 off a tattoo','50% off lash or brow lamination'],recoverAmount:120},

function mergeGlam(g){
  const d=JSON.parse(JSON.stringify(DEFAULT_GLAM));
  if(!g||!Array.isArray(g.levels)||g.levels.length!==5) return d;
  const out={...d,...g}; out.levels=g.levels.map((l,i)=>({...d.levels[i],...l})); return out;

/* Визиты клиентки из истории. Старые записи без деталей добираются из суммы трат. */
function visitsOf(c){
  const h=c.history||[];
  const v=h.filter(e=>e.kind==='visit'&&((e.amount||0)>0||(e.paid||0)>0)).map(e=>({ts:e.ts,paid:e.paid||0}));
  const rem=r2((c.spent||0)-v.reduce((s,x)=>s+x.paid,0));

/* Уровень считается по «квалификационным тратам» q. Визит увеличивает q.
   Понижение за неактивность сбрасывает q до порога нового уровня, поэтому прежняя сумма трат
   сама по себе уровень не возвращает. Потерянный уровень можно вернуть, потратив recoverAmount за recoverDays. */
function glamCompute(G,visits,now){
  const L=G.levels, D=G.downDays*DAY, R=G.recoverDays*DAY;
  const lvOf=q=>{let l=0;L.forEach((x,i)=>{if(q>=x.from)l=i});return l};
  const gi=L.findIndex(x=>x.giftsPerYear>0);
  let q=0,last=null,lost=null,total=0,anchor=null;const log=[];
  const demote=upTo=>{let k=0;
    while(last!=null && last+(k+1)*D<=upTo){k++;const t=last+k*D,l=lvOf(q);
      if(l>0){lost={level:(lost&&t-lost.at<=R)?Math.max(lost.level,l):l,at:t,spent:0};q=L[l-1].from;log.push({ts:t,type:'down',from:l,to:l-1});}}
    return k;};
  const mark=ts=>{if(anchor==null&&gi>=0&&lvOf(q)>=gi)anchor=ts;};
  for(const v of visits){
    demote(v.ts);
    const before=lvOf(q); let restored=false;
    if(lost&&v.ts-lost.at>R) lost=null;
    total+=v.paid; q+=v.paid;
    if(lost){
      lost.spent+=v.paid;
      if(lost.spent>=(L[lost.level].recoverAmount||0)&&lost.level>lvOf(q)){q=Math.max(q,L[lost.level].from);restored=true;log.push({ts:v.ts,type:'restore',from:before,to:lvOf(q)});lost=null;}
      else if(lost.level<=lvOf(q)) lost=null;
    }
    const after=lvOf(q);
    if(!restored&&after>before) log.push({ts:v.ts,type:'up',from:before,to:after});
    mark(v.ts); last=v.ts;
  }
  const k=demote(now);
  if(lost&&now-lost.at>R) lost=null;
  const level=lvOf(q), since=last!=null?Math.floor((now-last)/DAY):null;
  const daysToDown=(level>0&&last!=null)?Math.max(0,Math.ceil((last+(k+1)*D-now)/DAY)):null;
  let stage='ok';
  if(since!=null){ const cyc=since-k*G.downDays; if(level>0&&cyc>=G.warnDays) stage='warn'; else if(cyc>=G.remindDays) stage='remind'; }
  const next=level<L.length-1?L[level+1]:null;
  return {level,q,total,last,since,daysToDown,stage,downs:k,log,anchor,
    toNext:next?r2(Math.max(0,next.from-q)):null,
    pct:next?Math.max(0,Math.min(100,Math.round((q-L[level].from)/(next.from-L[level].from)*100))):100,
    lost:lost?{level:lost.level,need:r2(Math.max(0,(L[lost.level].recoverAmount||0)-lost.spent)),until:lost.at+R}:null};
}
function glamGifts(G,gc,history,now){
  const lv=G.levels[gc.level], used=(history||[]).filter(e=>e.kind==='gift').sort((a,b)=>a.ts-b.ts);

}
const ICONS=[
  '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',

const lvIcon=(i,size)=>`<span class="lv lv${i} ${size||''}" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[i]}</svg><small>LEVEL 0${i+1}</small></span>`;

  const future=L.map((l,i)=>({l,i})).filter(x=>x.l.giftsPerYear>0&&x.i>gc.level);
  return `<div class="panel"><h2>${esc(t('gifts'))}</h2>
    <div><div class="eyebrow">${esc(t('gAvail'))}</div>${avail}</div>
    <div><div class="eyebrow">${esc(t('gUsed'))}</div>${used}</div>
    <div><div class="eyebrow">${esc(t('gFuture'))}</div>${future.length?`<ul class="plain">${future.map(x=>`<li>${esc(t('gPerYear',x.l.name,x.l.giftsPerYear))}</li>`).join('')}</ul>`:`<p class="muted">${esc(t('gAllOpen'))}</p>`}</div></div>`;
}
function sheetHtml(){
  const G=cfg.glam,L=G.levels;
  const wrap=(inner,center)=>`<div class="sheet-bg" data-close="1"><div class="sheet ${center?'center':''}" role="dialog" aria-modal="true">${inner}</div></div>`;
  const closeBtn=`<button class="primary" data-close="1" id="sheetClose">${esc(t('close'))}</button>`;
  if(lvlup!=null){
    const i=lvlup,l=L[i];
    return wrap(`<div class="eyebrow">${esc(t('lvNew'))}</div>${lvIcon(i,'big')}<h3 class="confetti">${esc(t('welcome',l.name))}</h3><p>${esc(t('lvText'))}</p>
      <div class="perks" style="width:100%;text-align:left">${perkRows(G,i).filter(x=>x[1]!=='—').map(x=>`<div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div>
      ${l.levelBonus>0?`<p class="muted small">${esc(t('lvBonus',eur(l.levelBonus)))}</p>`:''}
      <button class="primary" id="sheetClose" data-close="1" data-newperks="${i}" style="width:100%">${esc(t('lvBtn'))}</button>`,true);
  }
  if(!sheet) return '';
  if(sheet.type==='level'){
    const i=sheet.i,l=L[i],gc=rec?gcOf(rec):null;
    const st=!gc?t('levelWord'):(i<gc.level?t('passed'):i===gc.level?t('curLevel'):t('notYet'));
    return wrap(`<div class="gl-head">${lvIcon(i,'big')}<div><div class="eyebrow">${esc(st)}</div><h3>${esc(l.name)}</h3><div class="muted small">${esc(fromRange(L,i))}</div></div></div>
      <div class="perks">${perkRows(G,i).map(x=>`<div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div>
      ${l.giftsPerYear>0?`<div><div class="eyebrow">${esc(t('giftChoice',l.giftsPerYear))}</div><ul class="plain">${giftsOf(l).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${i>0?`<p class="muted small">${esc(t('recover',eur(l.recoverAmount),G.recoverDays))}</p>`:''}${closeBtn}`);
  }
  if(sheet.type==='history'){
    const v=(rec.h||[]).filter(e=>e.kind==='visit'&&e.amount>0).sort((a,b)=>b.ts-a.ts);
    return wrap(`<h3>${esc(t('hTitle'))}</h3>${v.length?`<div class="visit-list">${v.map(e=>`<div><span>${esc(e.service||t('visit'))}<br><span class="muted small">${fmtDate(e.ts)}</span></span><b class="num">${eur(e.amount)}</b></div>`).join('')}</div>`:`<p class="muted">${esc(t('hEmpty'))}</p>`}${closeBtn}`);
  }
  if(sheet.type==='invite'){
    const rw=cfg.friend&&cfg.friend.val>0?rewardT(cfg.friend):'';
    return wrap(`<h3>${esc(t('iTitle'))}</h3><p>${esc(rw?t('iText',q.trim(),rw):t('iOff'))}</p>${closeBtn}`);
  }
  if(sheet.type==='terms'){
    const e=(cfg.expireDays>0&&rec.b>0&&rec.l>0)?rec.l+cfg.expireDays*DAY:0;
    return wrap(`<h3>${esc(t('tTitle'))}</h3><p>${esc(e?t('tExp',fmtDate(e)):t('tNoExp'))}</p>${rulesList().map(x=>`<p class="muted">${esc(x)}</p>`).join('')}${closeBtn}`);
  }
  return '';
}

function render(){
  if(!configured){ app.innerHTML=`<div class="panel"><h2>${esc(t('setup'))}</h2><p class="muted">${esc(t('setupText'))}</p></div>`; return; }
  if(!cfg){ app.innerHTML=`<p class="muted">${esc(err||t('loading'))}</p>`; return; }
  const g=glamOn(), G=cfg.glam;
  const act=cfg.actions.filter(a=>a.val>0).map(a=>`<div><span>${esc(actTitle(a))}</span><b>${rewardT(a)}</b></div>`).join('');
  const fr=cfg.friend&&cfg.friend.val>0?`<div><span>${esc(t('friendRow'))}</span><b>${rewardT(cfg.friend)}</b></div>`:'';
  const tiers=cfg.tiers.map((x,i,a)=>`<div><span>${i===a.length-1?t('fromA',eur(x.from)):(i===0?t('upTo',eur(a[i+1].from)):`${eur(x.from)} – ${eur(a[i+1].from)}`)} ${esc(t('spentWord'))}</span><b>${x.pct}%</b></div>`).join('');
  const glamRules=g?`<p>${esc(t('gr1'))}</p><p>${esc(t('gr2',G.remindDays,G.warnDays,G.downDays,G.levels[0].name))}</p><p>${esc(t('gr3',G.recoverDays))}</p>`:'';
  const tagline=lang==='en'?(cfg.taglineEn||''):(cfg.tagline||'');
  document.title=cfg.studio;
  app.innerHTML=`
  <div class="topbar"><span class="eyebrow">${esc(cfg.studio)} CLUB</span>
    <div class="langs" role="group" aria-label="Language"><button data-lang="ru" aria-pressed="${lang==='ru'}">RU</button><button data-lang="en" aria-pressed="${lang==='en'}">EN</button></div></div>
  <header><div><h1>${esc(cfg.studio)}</h1>${tagline?`<p class="muted">${esc(tagline)}</p>`:''}</div></header>
  ${PREVIEW&&!G.enabled?`<div class="hint warn">${esc(t('draft'))}</div>`:''}
  <div class="panel"><h2>${esc(t('checkTitle'))}</h2>
    <form id="f" style="display:flex;flex-direction:column;gap:12px">
      <label for="q">${esc(t('checkLabel'))}<input id="q" value="${esc(q)}" autocomplete="off" placeholder="${esc(t('checkPh'))}"></label>
      <button class="primary" ${busy?'disabled':''}>${esc(busy?t('searching'):t('checkBtn'))}</button>
      ${notFound?`<div class="neg small">${esc(t('notFound'))}</div>`:''}${err?`<div class="neg small">${esc(err)}</div>`:''}
    </form></div>
  ${rec?(g?heroBlocks(rec):oldBalanceCard(rec)):''}
  ${g?journey(rec):''}
  ${rec&&g?giftsPanel(rec):''}
  <div class="panel"><h2>${esc(t('ways'))}</h2><div class="ways">${fr}${act}</div>
    ${cfg.contact?`<p class="muted small">${esc(t('claim',cfg.contact))}</p>`:''}</div>
  ${g?'':`<div class="panel"><h2>${esc(t('oldTitle'))}</h2><div class="ways">${tiers}</div><p class="muted small">${esc(t('oldNote'))}</p></div>`}
  <div class="panel"><h2>${esc(t('rules'))}</h2>${rulesList().map(x=>`<p>${esc(x)}</p>`).join('')}${glamRules}</div>
  ${g?sheetHtml():''}`;
  document.getElementById('f').addEventListener('submit',e=>{ e.preventDefault(); q=document.getElementById('q').value; lookup(); });
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ setLang(b.dataset.lang); render(); });
  document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ sheet={type:'level',i:+b.dataset.lv}; render(); const c=document.getElementById('sheetClose'); if(c) c.focus(); });
  document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sheet;
    sheet= k==='perks'?{type:'level',i:gcOf(rec).level}:{type:k};
    render(); const c=document.getElementById('sheetClose'); if(c) c.focus(); });
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{ if(e.target===b){ const np=b.dataset.newperks; sheet=np!==undefined?{type:'level',i:+np}:null; lvlup=null; render(); } }));
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(sheet||lvlup!=null)){ sheet=null; lvlup=null; render(); } });

function checkLevelUp(){
  if(!rec||!glamOn()) return;
  const gc=gcOf(rec), k='glamLvl:'+keyOf(q); let prev=null;
  try{ prev=localStorage.getItem(k); }catch(e){}
  const ev=gc.log.filter(e=>e.type==='up'||e.type==='restore').pop(), fresh=ev&&Date.now()-ev.ts<14*DAY;
  if((prev!==null&&gc.level>+prev)||(prev===null&&gc.level>0&&fresh)) lvlup=gc.level;
  try{ localStorage.setItem(k,String(gc.level)); }catch(e){}
}
async function lookup(){
  if(!norm(q)) return;
  busy=true; err=''; notFound=false; render();
  try{
    const {data,error}=await sb.rpc('get_balance',{p_login:q});
    if(error) throw error;
    rec=data||null; notFound=!data;
    try{ localStorage.setItem('bonusQuery',q); }catch(e){}
    checkLevelUp();
  }catch(e){ err=t('balErr'); }
  busy=false; render();
}
(async()=>{
  render(); if(!sb) return;
  try{ const {data,error}=await sb.from('settings').select('cfg').eq('id',1).single(); if(error) throw error; cfg=data.cfg; cfg.glam=mergeGlam(cfg.glam); }
  catch(e){ err=t('loadErr'); }
  render(); if(cfg && q) lookup();
})();
</script>
</body>
</html>
