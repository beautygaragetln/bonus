<style>

.sheet.center .lv.big{margin-top:4px}
.spark{position:relative;display:inline-flex}
.sheet h3{font-style:italic}
.confetti{font-style:italic}
.visit-list div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}

.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px}

.bk:first-child{border-top:0;padding-top:0}
.bk .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill.dash{background:transparent;border:1px dashed var(--accent)}
.mono{font-family:ui-monospace,Menlo,monospace;word-break:break-all;font-size:12px}
.sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
</style>

<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const r2 = n => Math.round(n*100)/100;
let LOCALE='ru-RU';
const eur = n => r2(n).toLocaleString(LOCALE,{minimumFractionDigits:Number.isInteger(r2(n))?0:2,maximumFractionDigits:2})+' €';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString(LOCALE,{day:'numeric',month:'long'});
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/^@+/,'').replace(/\s+/g,' ').trim();
function hash(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const keyOf = s => hash(norm(s),0)+hash(norm(s),7);
const DAY = 864e5;
const reward = a => a.type==='pct' ? `скидка ${a.val}%` : `+${r2(a.val)} €`;
const tierFor = (cfg,spent) => cfg.tiers.reduce((t,x)=>spent>=x.from?x:t, cfg.tiers[0]);
const nextTier = (cfg,spent) => cfg.tiers.find(x=>x.from>spent);
function rulesText(cfg){
  const t=[];
  t.push(cfg.mode==='next' ? 'Бонусы действуют на ближайший визит. Что не потратили — сгорает.' : 'Бонусы копятся, и тратить их можно в любой момент и в любой сумме.');
  if(cfg.expireDays>0) t.push(`Срок действия — ${cfg.expireDays} дн. с последнего начисления.`);
  if(cfg.maxPct<100) t.push(`Бонусами можно оплатить до ${cfg.maxPct}% стоимости визита.`);
  return t;
}

/* ---------- Glam Levels ---------- */
const DEFAULT_GLAM = {
  enabled:false, remindDays:60, warnDays:80, downDays:90, recoverDays:60,
  levels:[
    {name:'Baby Glam',from:0,cashback:3,discount:0,birthday:5,levelBonus:0,priority:false,firstTattoo:0,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:0},
    {name:'Glam Girl',from:80,cashback:4,discount:2,birthday:7,levelBonus:5,priority:false,firstTattoo:10,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:30},
    {name:'It Girl',from:200,cashback:5,discount:3,birthday:10,levelBonus:10,priority:false,firstTattoo:15,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:60},
    {name:'Baddie',from:400,cashback:6,discount:5,birthday:15,levelBonus:15,priority:true,firstTattoo:20,giftsPerYear:1,gifts:['Бесплатное оформление бровей','Скидка 50% на макияж','25 € на татуировку','Скидка 50% на ламинирование ресниц или бровей'],giftsEn:['Free brow shaping','50% off makeup','€25 off a tattoo','50% off lash or brow lamination'],giftsEt:['Tasuta kulmukujundus','50% allahindlus meigile','25 € allahindlus tätoveeringule','50% allahindlus ripsmete või kulmude laminatsioonile'],recoverAmount:120},
    {name:'Super Baddie',from:700,cashback:7,discount:7,birthday:20,levelBonus:25,priority:true,firstTattoo:25,giftsPerYear:2,gifts:['Бесплатный макияж','Бесплатное ламинирование бровей','Бесплатное ламинирование ресниц','50 € на татуировку','50 € на курс «Макияж для себя»'],giftsEn:['Free makeup','Free brow lamination','Free lash lamination','€50 off a tattoo','€50 off the “Makeup for Yourself” course'],giftsEt:['Tasuta meik','Tasuta kulmude laminatsioon','Tasuta ripsmete laminatsioon','50 € allahindlus tätoveeringule','50 € allahindlus kursusele „Meik endale“'],recoverAmount:200}
  ]
};
function mergeGlam(g){
  const d=JSON.parse(JSON.stringify(DEFAULT_GLAM));
  if(!g||!Array.isArray(g.levels)||g.levels.length!==5) return d;
  const out={...d,...g}; out.levels=g.levels.map((l,i)=>({...d.levels[i],...l})); return out;
}
/* Визиты клиентки из истории. Старые записи без деталей добираются из суммы трат. */
function visitsOf(c){
  const h=c.history||[];
  const v=h.filter(e=>e.kind==='visit'&&((e.amount||0)>0||(e.paid||0)>0)).map(e=>({ts:e.ts,paid:e.paid||0}));
  const rem=r2((c.spent||0)-v.reduce((s,x)=>s+x.paid,0));
  if(rem>0.5) v.push({ts:h.length?Math.min(...h.map(e=>e.ts)):(c.createdAt||Date.now()),paid:rem});
  return v.sort((a,b)=>a.ts-b.ts);
}
/* Уровень считается по «квалификационным тратам» q. Визит увеличивает q.
   Понижение за неактивность сбрасывает q до порога нового уровня, поэтому прежняя сумма трат
   сама по себе уровень не возвращает. Потерянный уровень можно вернуть, потратив recoverAmount за recoverDays. */
function glamCompute(G,visits,now){
  const L=G.levels, D=G.downDays*DAY, R=G.recoverDays*DAY;
  const lvOf=q=>{let l=0;L.forEach((x,i)=>{if(q>=x.from)l=i});return l};
  const gi=L.findIndex(x=>x.giftsPerYear>0);
  let q=0,last=null,lost=null,total=0,anchor=null;const log=[];
  const demote=upTo=>{let k=0;
    while(last!=null && last+(k+1)*D<=upTo){k++;const t=last+k*D,l=lvOf(q);
      if(l>0){lost={level:(lost&&t-lost.at<=R)?Math.max(lost.level,l):l,at:t,spent:0};q=L[l-1].from;log.push({ts:t,type:'down',from:l,to:l-1});}}
    return k;};
  const mark=ts=>{if(anchor==null&&gi>=0&&lvOf(q)>=gi)anchor=ts;};
  for(const v of visits){
    demote(v.ts);
    const before=lvOf(q); let restored=false;
    if(lost&&v.ts-lost.at>R) lost=null;
    total+=v.paid; q+=v.paid;
    if(lost){
      lost.spent+=v.paid;
      if(lost.spent>=(L[lost.level].recoverAmount||0)&&lost.level>lvOf(q)){q=Math.max(q,L[lost.level].from);restored=true;log.push({ts:v.ts,type:'restore',from:before,to:lvOf(q)});lost=null;}
      else if(lost.level<=lvOf(q)) lost=null;
    }
    const after=lvOf(q);
    if(!restored&&after>before) log.push({ts:v.ts,type:'up',from:before,to:after});
    mark(v.ts); last=v.ts;
  }
  const k=demote(now);
  if(lost&&now-lost.at>R) lost=null;
  const level=lvOf(q), since=last!=null?Math.floor((now-last)/DAY):null;
  const daysToDown=(level>0&&last!=null)?Math.max(0,Math.ceil((last+(k+1)*D-now)/DAY)):null;
  let stage='ok';
  if(since!=null){ const cyc=since-k*G.downDays; if(level>0&&cyc>=G.warnDays) stage='warn'; else if(cyc>=G.remindDays) stage='remind'; }
  const next=level<L.length-1?L[level+1]:null;
  return {level,q,total,last,since,daysToDown,stage,downs:k,log,anchor,
    toNext:next?r2(Math.max(0,next.from-q)):null,
    pct:next?Math.max(0,Math.min(100,Math.round((q-L[level].from)/(next.from-L[level].from)*100))):100,
    lost:lost?{level:lost.level,need:r2(Math.max(0,(L[lost.level].recoverAmount||0)-lost.spent)),until:lost.at+R}:null};
}
function glamGifts(G,gc,history,now){
  const lv=G.levels[gc.level], used=(history||[]).filter(e=>e.kind==='gift').sort((a,b)=>a.ts-b.ts);
  let avail=0,periodStart=null,nextAt=null;
  if(gc.anchor!=null){
    const Y=365*DAY,k=Math.floor((now-gc.anchor)/Y);periodStart=gc.anchor+k*Y;nextAt=periodStart+Y;
    avail=Math.max(0,(lv.giftsPerYear||0)-used.filter(e=>e.ts>=periodStart).length);
  }
  return {avail,choices:lv.giftsPerYear>0?lv.gifts:[],used,nextAt,allow:lv.giftsPerYear||0};

function loginTaken(login,exceptId){ return S.clients.some(c=>c.id!==exceptId && keyOf(c.login)===keyOf(login)); }
function addClient(e){
  e.preventDefault();
  const name=$('#nName').value.trim(); if(!name) return;
  const login=($('#nLogin').value.trim()||name);
  if(loginTaken(login)){ toast('Такой ник или имя для входа уже есть. Добавьте отличие.'); return; }
  const c={id:uid(),name,login,phone:$('#nPhone').value.trim(),birthday:'',balance:0,spent:0,disc:0,refBy:$('#nRef').value||'',refPaid:false,lastEarn:0,createdAt:Date.now(),history:[]};
  S.clients.push(c); persist(); openId=c.id; view='detail'; toast('Добавлено'); render();
}
function calcVisit(c,amount,useReq,tattoo,now){
  now=now||Date.now();
  const cfg=cfgOf(), g=G(), gl=g.enabled, bal=effBal(c);
  const gc=gcOf(c,null,now), lv=g.levels[gc.level];
  amount=r2(Math.max(0,amount||0));
  const levelDisc=gl?lv.discount:0;
  const firstTat=gl&&tattoo&&!c.history.some(e=>e.tattoo)?lv.firstTattoo:0;
  const discPct=Math.min(100,(c.disc||0)+levelDisc+firstTat), discAmt=r2(amount*discPct/100), net=r2(amount-discAmt);
  const usable=r2(Math.min(bal,net*cfg.maxPct/100));
  const use=useReq==null||isNaN(useReq)? usable : r2(Math.min(Math.max(0,useReq),usable));
  const paid=r2(net-use), pct=gl?lv.cashback:tierFor(cfg,c.spent).pct, cb=r2(paid*pct/100);
  const burn=cfg.mode==='next'? r2(bal-use) : 0;
  const ref=(c.refBy&&!c.refPaid&&paid>0&&cfg.friend.val>0)? S.clients.find(x=>x.id===c.refBy):null;
  const bonuses=[];
  if(gl&&amount>0){
    const after=gcOf(c,[{ts:now,paid}],now);
    const up=after.log.find(e=>e.ts===now&&e.type==='up');
    if(up) for(let i=up.from+1;i<=up.to;i++) if(g.levels[i].levelBonus>0&&!c.history.some(e=>e.kind==='lvlbonus'&&e.lvl===i)) bonuses.push({lvl:i,amt:g.levels[i].levelBonus});
  }
  return {amount,discPct,discAmt,net,usable,use,paid,pct,cb,burn,ref,bal,bonuses,levelDisc,firstTat};
}
function previewVisit(){
  const c=cur(), el=$('#preview'); if(!c||!el) return;
  const raw=$('#vUse').value, v=calcVisit(c,parseFloat($('#vAmt').value),raw===''?null:parseFloat(raw),isTattoo($('#vCat').value));
  if(!v.amount){ el.textContent='Введите сумму, чтобы увидеть расчёт.'; return; }
  el.textContent=[
    v.discAmt?`Скидка ${v.discPct}%: −${eur(v.discAmt)}.`:'',
    `К оплате деньгами: ${eur(v.paid)}${v.use?` (бонусами ${eur(v.use)})`:''}.`,
    `Кэшбэк ${v.pct}%: +${eur(v.cb)}.`,
    v.bonuses.length?`Откроется уровень ${v.bonuses.map(b=>gname(b.lvl)).join(', ')}: бонус ${eur(v.bonuses.reduce((s,b)=>s+b.amt,0))}.`:'',
    v.burn>0?`Сгорит неиспользованных бонусов: ${eur(v.burn)}.`:'',
    v.ref?`${v.ref.name} получит награду за подругу.`:''
  ].filter(Boolean).join(' ');
}
function recordVisit(e){
  e.preventDefault();
  const c=cur(); if(!c) return;
  settle(c);
  const service=$('#vCat').value, tattoo=isTattoo(service), raw=$('#vUse').value;
  const ts=Date.now(), v=calcVisit(c,parseFloat($('#vAmt').value),raw===''?null:parseFloat(raw),tattoo,ts);
  if(!v.amount) return;
  const note=$('#vNote').value.trim();
  c.history.push({ts,delta:0,note:`${service||'Визит'} ${eur(v.amount)}${note?' · '+note:''}`,kind:'visit',amount:v.amount,paid:v.paid,tattoo,service});
  if(v.discAmt) c.history.push({ts,delta:0,note:`Применена скидка ${v.discPct}% (−${eur(v.discAmt)})`});
  if(v.use){ c.balance=r2(c.balance-v.use); c.history.push({ts,delta:-v.use,note:'Оплата бонусами'}); }
  if(v.burn>0){ c.balance=r2(c.balance-v.burn); c.history.push({ts,delta:-v.burn,note:'Не использованные бонусы сгорели'}); }
  c.disc=0; c.spent=r2(c.spent+v.paid);
  if(v.cb>0) credit(c,v.cb,`Кэшбэк ${v.pct}%`);
  v.bonuses.forEach(b=>credit(c,b.amt,`Level Up: ${gname(b.lvl)}`,{kind:'lvlbonus',lvl:b.lvl}));
  if(v.ref){ settle(v.ref); giveReward(v.ref,cfgOf().friend,`Подруга ${c.name} пришла на первый визит`); c.refPaid=true; }
  persist(); toast(`Записано. Кэшбэк ${eur(v.cb)}`); render(); pushKick();
}

function saveSchedule(e){

function backupCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Имя','Вход','Телефон','Email','Рассылки','День рождения','Баланс','Потрачено','Создана']].concat(S.clients.map(c=>[c.name,c.login,c.phone,c.email,c.marketing?'да':'нет',c.birthday,c.balance,c.spent,new Date(c.createdAt).toISOString().slice(0,10)]));
  saveFile(`beauty-garage-clients-${stamp()}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv;charset=utf-8');
  markBackup(); toast('Список клиенток скачан'); render();
}
function exportClient(c){
  saveFile(`client-${norm(c.login).replace(/[^a-z0-9а-я_-]+/gi,'-')||'data'}-${stamp()}.json`,JSON.stringify({...c,bookings:S.bookings.filter(b=>b.client_id===c.id)},null,2),'application/json'); toast('Данные клиентки скачаны');
}
function dataView(){
  let last=0; try{ last=+localStorage.getItem('lastBackup')||0; }catch(e){}
  const days=last?Math.floor((Date.now()-last)/DAY):null;
  return `<div class="panel"><h2>Резервная копия</h2>
    <p class="${days===null||days>7?'neg':'muted'}">${days===null?'Копию на этом устройстве ещё не скачивали.':`Последняя копия: ${days} дн. назад.`} Рекомендуем скачивать раз в неделю.</p>
    <div class="actions"><button class="primary" id="bakJson">Скачать всё (JSON)</button><button id="bakCsv">Список клиенток (CSV)</button></div>
    <p class="muted small">Файлы содержат персональные данные клиенток. Храните их в защищённом месте и удаляйте старые копии.</p></div>
  <div class="panel"><h2>Персональные данные (GDPR)</h2>
    <p>Мы храним: имя, ник для входа, телефон (по желанию), день рождения (по желанию), историю визитов и бонусов.</p>
    <p class="muted">По запросу клиентки откройте её карточку: кнопка «Выгрузить данные клиентки» отдаёт всё, что о ней хранится, а «Удалить клиентку навсегда» стирает её записи. Не храните лишнего и не оставляйте старые резервные копии.</p>
    <p class="muted small">Перед запуском для широкой аудитории стоит добавить политику конфиденциальности и согласие на хранение данных и показать их юристу.</p></div>`;
}

/* ---------- boot ---------- */
const configured = window.SUPABASE_URL && !String(window.SUPABASE_URL).startsWith('ВСТАВЬТЕ');
const sb = configured && window.supabase ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY) : null;
function showMsg(title,text){ $app.innerHTML=`<header><h1>Beauty Garage: админка</h1></header><div class="panel"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p></div>`; }
function showLogin(err){
  $app.innerHTML=`<header><h1>Beauty Garage: админка</h1></header><div class="panel"><h2>Вход</h2>
    <form id="lf" style="display:flex;flex-direction:column;gap:12px">
      <label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Пароль<input id="lPass" type="password" autocomplete="current-password" required></label>
      ${err?`<div class="neg small">${esc(err)}</div>`:''}
      <button class="primary">Войти</button></form></div>`;
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
    if(error) showLogin('Неверный email или пароль.'); else boot();
  });
}
async function load(){
  showMsg('Загрузка…','');
  const [s,c]=await Promise.all([sb.from('settings').select('cfg').eq('id',1).single(), sb.from('clients').select('id,name,login,phone,birthday,balance,spent,disc,ref_by,ref_paid,last_earn,created_at,history,email,marketing')]);
  if(s.error||c.error){ showMsg('Не удалось загрузить данные','Если вы только что обновили файлы, сначала выполните в Supabase скрипт migration-glam.sql. Иначе проверьте config.js.'); return; }
  const [bk,bl,pr]=await Promise.all([sb.from('bookings').select('*').order('start_at'),sb.from('blocks').select('*').order('start_at'),sb.from('admin_private').select('feed_token').eq('id',1).single()]);
  if(bk.error||bl.error){ showMsg('Не удалось загрузить записи','Сначала выполните в Supabase скрипт migration-booking.sql (SQL Editor), затем обновите страницу.'); return; }
  S.bookings=bk.data||[]; S.blocks=bl.data||[]; S.token=(pr.data&&pr.data.feed_token)||'';
  S.cfg=s.data.cfg; cfgSnap=JSON.stringify(S.cfg); S.cfg.glam=mergeGlam(S.cfg.glam); S.cfg.booking=mergeBooking(S.cfg.booking); S.cfg.push=mergePush(S.cfg.push);
  const [ps,pl,pc]=await Promise.all([sb.from('push_subs').select('id,client_id,lang,enabled,last_ok,created_at,ua'),sb.from('push_log').select('*').order('created_at',{ascending:false}).limit(40),sb.rpc('push_config')]);
  S.pushReady=!(ps.error||pl.error); S.psubs=(ps.data)||[]; S.plog=(pl.data)||[]; S.pushKey=!!(pc.data&&pc.data.key);
  S.clients=c.data.map(fromRow); S.clients.forEach(x=>snap.set(x.id,JSON.stringify(toRow(x))));
  S.clients.forEach(settle); persist(); render();
  setInterval(refreshBookings,60000);
}
async function boot(){
  if(!sb){ showMsg('Нужна настройка','Откройте файл config.js и вставьте данные из Supabase.'); return; }
  const {data}=await sb.auth.getSession();
  if(!data.session) showLogin(); else load();
}
boot();

</script>
