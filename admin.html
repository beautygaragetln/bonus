<style>
/* iOS/Android: шрифт полей >=16px, иначе Safari приближает страницу при вводе и не возвращает */

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

}
@media (prefers-color-scheme:dark){:root{
  --bg:#241917; --surface:#3E2C29; --fg:#F3EDE7; --muted:#B7A79F; --line:#57433F;
  --accent:#F2B7CC; --accent-fg:#3E2C29; --soft:#4B3338;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}

.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;flex-wrap:wrap}

button,input,select,textarea{font:inherit;color:inherit}

.claim{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}.claim:first-of-type{border-top:0}.claim>div:first-child{flex:1;min-width:220px}.claim-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.claim-act input{min-width:180px;flex:1}.mdir{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:6px;border-radius:9px}.mdir:has(input:checked){background:var(--surface)}

<script>
const r2 = n => Math.round(n*100)/100;
let LOCALE='ru-RU';
const gp = n => r2(n).toLocaleString(LOCALE,{maximumFractionDigits:2})+' GP';
const eur = n => r2(n).toLocaleString(LOCALE,{minimumFractionDigits:Number.isInteger(r2(n))?0:2,maximumFractionDigits:2})+' €';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString(LOCALE,{day:'numeric',month:'long'});
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/^@+/,'').replace(/\s+/g,' ').trim();
function hash(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const keyOf = s => hash(norm(s),0)+hash(norm(s),7);
const DAY = 864e5;
const reward = a => a.type==='pct' ? `скидка ${a.val}%` : `+${r2(a.val)} €`;
const tierFor = (cfg,spent) => cfg.tiers.reduce((t,x)=>spent>=x.from?x:t, cfg.tiers[0]);
const nextTier = (cfg,spent) => cfg.tiers.find(x=>x.from>spent);
function rulesText(cfg){
  const t=[];
  t.push(cfg.mode==='next' ? 'Бонусы действуют на ближайший визит. Что не потратили — сгорает.' : 'Бонусы копятся, и тратить их можно в любой момент и в любой сумме.');
  if(cfg.expireDays>0) t.push(`Срок действия — ${cfg.expireDays} дн. с последнего начисления.`);
  if(cfg.maxPct<100) t.push(`Бонусами можно оплатить до ${cfg.maxPct}% стоимости визита.`);
  return t;
}

/* ---------- Glam Levels ---------- */
const DEFAULT_GLAM = {
  enabled:false, remindDays:60, warnDays:80, downDays:90, recoverDays:60,
  tasks:{baddie:{need:4,required:[],items:[{id:'ref',target:2},{id:'mark',target:6},{id:'svc',target:3},{id:'reels',target:1},{id:'repost',target:5},{id:'supp',target:1}]},super:{need:5,required:['ref','both','supp'],items:[{id:'ref',target:3},{id:'both',target:2},{id:'supp',target:2},{id:'mark',target:10},{id:'repost',target:10},{id:'reels',target:2}]}},
  levels:[
    {name:'Baby Glam',from:0,cashback:3,discount:0,birthday:5,levelBonus:0,priority:false,firstTattoo:0,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:0},
    {name:'Glam Girl',from:200,cashback:4,discount:2,birthday:7,levelBonus:5,priority:false,firstTattoo:10,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:30},
    {name:'It Girl',from:400,cashback:5,discount:3,birthday:10,levelBonus:10,priority:false,firstTattoo:15,giftsPerYear:0,gifts:[],giftsEn:[],giftsEt:[],recoverAmount:60},
    {name:'Baddie',from:600,cashback:6,discount:5,birthday:15,levelBonus:15,priority:true,firstTattoo:20,giftsPerYear:1,gifts:['Бесплатное оформление бровей','Скидка 50% на макияж','25 € на татуировку','Скидка 50% на ламинирование ресниц или бровей'],giftsEn:['Free brow shaping','50% off makeup','€25 off a tattoo','50% off lash or brow lamination'],giftsEt:['Tasuta kulmukujundus','50% allahindlus meigile','25 € allahindlus tätoveeringule','50% allahindlus ripsmete või kulmude laminatsioonile'],recoverAmount:120},
    {name:'Super Baddie',from:900,cashback:7,discount:7,birthday:20,levelBonus:25,priority:true,firstTattoo:25,giftsPerYear:2,gifts:['Бесплатный макияж','Бесплатное ламинирование бровей','Бесплатное ламинирование ресниц','50 € на татуировку','50 € на курс «Макияж для себя»'],giftsEn:['Free makeup','Free brow lamination','Free lash lamination','€50 off a tattoo','€50 off the “Makeup for Yourself” course'],giftsEt:['Tasuta meik','Tasuta kulmude laminatsioon','Tasuta ripsmete laminatsioon','50 € allahindlus tätoveeringule','50 € allahindlus kursusele „Meik endale“'],recoverAmount:200}
  ]
};
function mergeGlam(g){

}

function loginTaken(login,exceptId){ return S.clients.some(c=>c.id!==exceptId && keyOf(c.login)===keyOf(login)); }
function addClient(e){

  const refSel=$('#nRef').value||'';
  const c={id:uid(),name,login,phone:$('#nPhone').value.trim(),birthday:'',balance:0,spent:0,disc:0,refBy:'',refPaid:false,lastEarn:0,createdAt:Date.now(),history:[]};
  S.clients.push(c); persist(); openId=c.id; view='detail'; toast('Добавлено'); render();
  if(refSel) saveQ.then(()=>sb.rpc('admin_set_referrer',{p_client:c.id,p_referrer:refSel})).then(()=>reloadClient(c.id)).then(()=>{ loadRw(c.id,true); render(); }).catch(()=>{});
}
function previewVisit(){
  const c=cur(), el=$('#preview'); if(!c||!el) return;
  const d=S.rw[c.id], R=RWC(), amt=r2(parseFloat($('#vAmt').value)||0);
  if(!amt){ el.textContent='Введите сумму, чтобы увидеть расчёт.'; return; }
  const wlU=d&&d.wl&&$('#vWelcome')&&$('#vWelcome').checked&&amt>=d.wl.min, wl=wlU?r2(Math.min(d.wl.eur,amt)):0;
  const cp=d&&d.rw.coupon, use=cp&&$('#vCoupon')&&$('#vCoupon').checked, ap=use?r2(Math.min(cp.a,R.maxPerVisit,amt-wl)):0, paid=r2(amt-wl-ap);
  const tot=d?d.rw.paidTotal:0, gain=Math.floor((tot+paid)/R.step)-Math.floor(tot/R.step), cnt=d?d.rw.cnt:0;
  el.textContent=[wl?`Приветственная скидка −${eur(wl)}.`:'',ap?`Купон −${eur(ap)}${cp.a>ap?` (остаток ${eur(r2(cp.a-ap))} вернётся в баллы)`:''}.`:'', `К оплате деньгами: ${eur(paid)}.`,
    `Начислится: +${gp(gain*R.reward)}.`,
    paid>=R.minVisit?`Визит засчитается в Milestones (будет ${cnt+1}).`:`Меньше ${eur(R.minVisit)} деньгами: в Milestones не засчитается.`].filter(Boolean).join(' ');
}

async function checkLevelBonuses(c){
  if(!c||!G().enabled) return;
  const gc=gcOf(c), L=G().levels; let any=false;
  for(let i=1;i<=gc.level;i++){
    if(!(L[i].levelBonus>0)||c.history.some(e=>e.kind==='lvlbonus'&&e.lvl===i)) continue;
    const {data}=await sb.rpc('admin_grant_special',{p_client:c.id,p_amount:L[i].levelBonus*RATE(),p_note:`Level Up: ${L[i].name}`,p_kind:'levelup',p_idem:`lvl:${c.id}:${i}`});
    if(data&&data.ok){ c.history.push({ts:Date.now(),delta:0,note:`Level Up: ${L[i].name}`,kind:'lvlbonus',lvl:i}); any=true; }
  }
  if(any){ persist(); await loadRw(c.id,true); await loadRwBal(); }
}

// читает фото; HEIC/HEIF с iPhone, которые браузер не открывает сам, переводит в JPEG
async function readPhoto(file){
  const heic=/hei[cf]/i.test(file.type||'')||/\.hei[cf]$/i.test(file.name||'');
  let url=URL.createObjectURL(file);
  try{ return await loadImg(url); }
  catch(e){
    URL.revokeObjectURL(url);
    if(!heic) throw e;
    if(!window.heic2any) await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
    let b=await window.heic2any({blob:file,toType:'image/jpeg',quality:.9}); if(Array.isArray(b)) b=b[0];
    return await loadImg(URL.createObjectURL(b));
  }
}
// окно обрезки: двигай фото пальцем или мышью, масштаб ползунком или колесом
function cropPhoto(im,size){
  return new Promise(resolve=>{
    const V=Math.min(300,window.innerWidth-80), W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;
    const base=V/Math.min(W,H); let z=1, ox=0, oy=0;
    const bg=document.createElement('div'); bg.className='sheet-bg'; bg.setAttribute('role','dialog'); bg.setAttribute('aria-modal','true');
    bg.innerHTML=`<div class="sheet center"><h3>Выбери кусок фото</h3><p class="muted">Двигай фото и меняй масштаб</p>
      <div class="crop" id="cpBox" style="width:${V}px;height:${V}px"><img id="cpImg" alt="" draggable="false"></div>
      <input type="range" id="cpZoom" min="1" max="4" step="0.01" value="1" aria-label="Масштаб" style="width:${V}px">
      <div style="display:flex;gap:10px;justify-content:center"><button type="button" class="ghost" id="cpNo">Отмена</button><button type="button" id="cpOk">Готово</button></div></div>`;
    document.body.appendChild(bg);
    const box=bg.querySelector('#cpBox'), img=bg.querySelector('#cpImg'); img.src=im.src;
    const clamp=()=>{ const w=W*base*z, hh=H*base*z; ox=Math.min(0,Math.max(V-w,ox)); oy=Math.min(0,Math.max(V-hh,oy)); };
    const draw=()=>{ clamp(); const s=base*z; img.style.width=W*s+'px'; img.style.height=H*s+'px'; img.style.transform=`translate(${ox}px,${oy}px)`; };
    const setZ=(nz,cx,cy)=>{ nz=Math.min(4,Math.max(1,nz)); const k=nz/z; ox=cx-(cx-ox)*k; oy=cy-(cy-oy)*k; z=nz; bg.querySelector('#cpZoom').value=z; draw(); };
    ox=(V-W*base)/2; oy=(V-H*base)/2; draw();
    let drag=null; const pts=new Map(); let pd=0;
    box.addEventListener('pointerdown',e=>{ box.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1) drag={x:e.clientX,y:e.clientY,ox,oy}; if(pts.size===2){ const [a,b]=[...pts.values()]; pd=Math.hypot(a.x-b.x,a.y-b.y); } });
    box.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(pd) setZ(z*d/pd,V/2,V/2); pd=d; }
      else if(drag){ ox=drag.ox+(e.clientX-drag.x); oy=drag.oy+(e.clientY-drag.y); draw(); } });
    const up=e=>{ pts.delete(e.pointerId); pd=0; drag=null; if(pts.size===1){ const [a]=[...pts.values()]; drag={x:a.x,y:a.y,ox,oy}; } };
    box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
    box.addEventListener('wheel',e=>{ e.preventDefault(); const r=box.getBoundingClientRect(); setZ(z*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top); },{passive:false});
    bg.querySelector('#cpZoom').oninput=e=>setZ(+e.target.value,V/2,V/2);
    const done=v=>{ bg.remove(); document.removeEventListener('keydown',onKey); resolve(v); };
    const onKey=e=>{ if(e.key==='Escape') done(null); };
    document.addEventListener('keydown',onKey);
    bg.querySelector('#cpNo').onclick=()=>done(null);
    bg.addEventListener('mousedown',e=>{ if(e.target===bg) done(null); });
    bg.querySelector('#cpOk').onclick=()=>{
      const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'), s=base*z;
      x.fillStyle='#F3EDE7'; x.fillRect(0,0,size,size); x.imageSmoothingQuality='high';
      x.drawImage(im,-ox/s,-oy/s,V/s,V/s,0,0,size,size);
      done(c.toDataURL('image/jpeg',0.82));
    };
  });
}

function settleCalc(rows){
  const R=RWC(), ok=rows.filter(x=>x.status==='ok'), M={tattoo:{cash:0,given:0,sp:0,n:0},beauty:{cash:0,given:0,sp:0,n:0}}; let none=0, noneC=0;
  ok.forEach(x=>{ const k=M[x.master]; if(!k){ none++; noneC+=(+x.coupon_rw)+(R.settleSpecial?+x.coupon_sp:0); return; }
    k.n++; k.cash+=+x.paid; k.given+=(+x.coupon_rw)+(R.settleSpecial?+x.coupon_sp:0); k.sp+=+x.coupon_sp; });
  const total=r2(M.tattoo.given+M.beauty.given+noneC), half=r2(total/2);
  const diffT=r2(M.tattoo.given+noneC/2-half), res={M,total,half,none,from:null,to:null,amount:0};
  if(diffT>0){ res.from='beauty'; res.to='tattoo'; res.amount=diffT; } else if(diffT<0){ res.from='tattoo'; res.to='beauty'; res.amount=-diffT; }
  return res;
}

async function bkUpdate(id,patch,msg){

  const b=S.bookings.find(x=>x.id===id); if(b) Object.assign(b,patch); toast(msg); render();
}
async function confirmBk(id,note,force){
  const {data,error}=await sb.rpc('admin_confirm_booking',{p_id:id,p_note:note,p_force:!!force});
  if(error){ toast('Не удалось подтвердить: '+error.message); return; }
  if(data&&data.error==='conflict'){ if(confirm('Это время уже занято (мастер или кушетка). Подтвердить всё равно?')) return confirmBk(id,note,true); return; }

  const b=S.bookings.find(x=>x.id===id); if(b){ b.status='confirmed'; b.admin_note=note; } toast('Подтверждено'); render(); pushBooking(id,'confirmed');

function pushReward(id,d){ if(!(S.pushKey&&typeof fn==='function')) return; if(d.earned>0||(d.milestones||[]).length) fn({action:'reward',client:id,earned:d.earned,milestones:d.milestones}).catch(()=>{});

async function addBlock(e){

async function setAdminMaster(email,master){

function collectWheelRows(){
  const rows=(S.wDraft||S.wPrizes||[]).map(r=>({...r,label:{...(r.label||{})},short:{...(r.short||{})}}));
  document.querySelectorAll('[data-w]').forEach(el=>{ const r=rows[+el.dataset.i]; if(!r) return; const f=el.dataset.w;
    if(f==='short'){ r.short={ru:el.value.trim(),en:el.value.trim(),et:el.value.trim()}; }
    else if(f==='ru'||f==='en'||f==='et') r.label[f]=el.value.trim();
    else if(f==='weight') r.weight=Math.max(0,Math.floor(+el.value||0));
    else if(f==='stock') r.stock=el.value===''?null:Math.max(1,Math.floor(+el.value));
    else if(f==='active') r.active=el.checked; });
  return rows;
}

async function fn(body){

  if(error){ let m=error.message||'ошибка'; try{ const j=await error.context.json(); m=j.error||m; }catch(_){} throw new Error(m); }
  if(data&&data.error) throw new Error(data.error);
  return data;
}

create extension if not exists pg_net with schema extensions;
select cron.unschedule(jobid) from cron.job where jobname = 'glam-push';
select cron.schedule('glam-push', '5 * * * *', $$
  select net.http_post(
    url := '${String(window.SUPABASE_URL).replace(/\/$/,'')}/functions/v1/push',
    headers := jsonb_build_object('Content-Type', 'application/json', 'x-cron-secret', (select cron_secret from public.push_private where id = 1)),
    body := '{"action":"cron"}'::jsonb
  );
$$);
select cron.unschedule(jobid) from cron.job where jobname = 'glam-push-daily';

    url := '${String(window.SUPABASE_URL).replace(/\/$/,'')}/functions/v1/push',

  );
$$);`;

async function refreshPush(){
  const [ps,pl,pc]=await Promise.all([sb.from('push_subs').select('id,client_id,lang,enabled,last_ok,created_at,ua'),sb.from('push_log').select('*').order('created_at',{ascending:false}).limit(40),sb.rpc('push_config')]);
  if(!ps.error) S.psubs=ps.data||[]; if(!pl.error) S.plog=pl.data||[]; S.pushKey=!!(pc.data&&pc.data.key);
}
const EMOJIS=['✨','💖','🌸','🎄','🎁','❄️','🔥','🥰','💅','💄','🌟','🎉','🤍','🎀','☀️','🙌','💋','🫶','⭐','🌷'];
S.pPick=S.pPick||new Set(); S.pQ='';
function pickRows(){ const q=(S.pQ||'').toLowerCase().trim(), has=new Set(S.psubs.map(x=>x.client_id));
  return byName(S.clients).filter(c=>!q||(c.name+' '+c.login+' '+(c.phone||'')).toLowerCase().includes(q)).map(c=>({c,has:has.has(c.id)})); }
function drawPick(){
  const box=$('#pPickList'); if(!box) return; const rows=pickRows();
  box.innerHTML=rows.length?rows.map(({c,has})=>`<label class="check pick-row"><input type="checkbox" data-pk="${esc(c.id)}" ${S.pPick.has(c.id)?'checked':''}><span>${esc(c.name)} <span class="muted small">@${esc(c.login)}${has?'':' · нет push'}</span></span></label>`).join(''):'<p class="muted small">Никого не найдено.</p>';
  const n=[...S.pPick].filter(id=>S.clients.some(c=>c.id===id)).length; const e=$('#pPickCnt'); if(e) e.textContent='Выбрано: '+n;
}
function insertEmoji(em){
  let el=S.lastEmo&&document.body.contains(S.lastEmo)?S.lastEmo:$('#pText'); if(!el) return;
  const a=el.selectionStart==null?el.value.length:el.selectionStart, b=el.selectionEnd==null?a:el.selectionEnd;
  el.value=el.value.slice(0,a)+em+el.value.slice(b); const p=a+em.length; try{ el.setSelectionRange(p,p); }catch(_){} el.focus(); el.dispatchEvent(new Event('input',{bubbles:true}));
}
function collectDaily(){
  const P=mergePush(S.cfg.push), D={...P.daily};
  D.enabled=!!($('#dEnabled')&&$('#dEnabled').checked);
  if($('#dSlots')) D.slots=$('#dSlots').value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
  const rows={}; document.querySelectorAll('[data-dm]').forEach(el=>{ (rows[el.dataset.i]=rows[el.dataset.i]||{})[el.dataset.dm]=el.value.trim(); });
  if(Object.keys(rows).length) D.msgs=Object.keys(rows).sort((a,b)=>a-b).map(k=>rows[k]);
  return D;
}
function pushPayload(){
  const v=id=>($('#'+id)?$('#'+id).value.trim():''), a=$('#pAud').value;
  const aud=a==='all'?{type:'all'}:a==='pick'?{type:'clients',ids:[...S.pPick].filter(id=>S.clients.some(c=>c.id===id))}:{type:'level',level:+a.slice(3)};
  return {action:'send',audience:aud,category:$('#pCat').value,title:{ru:v('pTitle'),en:v('pTitleEn'),et:v('pTitleEt')},text:{ru:v('pText'),en:v('pTextEn'),et:v('pTextEt')}};
}
function collectPush(){
  const P=mergePush(S.cfg.push), c=id=>$('#'+id).checked, v=id=>$('#'+id).value;
  P.clientUI=c('qUI'); P.auto=c('qAuto'); P.dry=c('qDry');
  P.rules={booking:c('rBooking'),birthday:c('rBirthday'),expiry:c('rExpiry'),level:c('rLevel'),midweek:c('rMid')};
  P.remindHours=Math.min(72,Math.max(1,+v('qRemind')||24)); P.quietFrom=v('qQf')||'21:00'; P.quietTo=v('qQt')||'09:00';
  P.bdayHour=Math.min(23,Math.max(0,+v('qBd')||0)); P.midweekDay=+v('qMd'); P.midweekHour=Math.min(19,Math.max(0,+v('qMh')||0));
  P.midweekText={ru:v('qMtRu').trim()||DEF_PUSH.midweekText.ru,en:v('qMtEn').trim()||DEF_PUSH.midweekText.en,et:v('qMtEt').trim()||DEF_PUSH.midweekText.et};
  return P;
}
function showRes(id,t){ const e=$('#'+id); if(e){ e.style.display='block'; e.textContent=t; } }
function bindPushAdmin(){
  document.addEventListener('focusin',function f(e){ if(e.target&&e.target.dataset&&e.target.dataset.emo) S.lastEmo=e.target; },{once:false});
  document.querySelectorAll('[data-emoji]').forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>insertEmoji(b.dataset.emoji); });
  const pa=$('#pAud'); if(pa){ const sync=()=>{ S.pAudPick=pa.value==='pick'; const bx=$('#pPickBox'); if(bx) bx.style.display=S.pAudPick?'flex':'none'; if(S.pAudPick) drawPick(); }; pa.onchange=sync; sync();
    on('#pPickQ','input',e=>{ S.pQ=e.target.value; drawPick(); });
    on('#pPickAll','click',()=>{ const has=new Set(S.psubs.map(x=>x.client_id)); pickRows().forEach(({c})=>{ if(has.has(c.id)) S.pPick.add(c.id); }); drawPick(); });
    on('#pPickNone','click',()=>{ S.pPick.clear(); drawPick(); });
    const pl=$('#pPickList'); if(pl) pl.onchange=e=>{ const id=e.target.dataset&&e.target.dataset.pk; if(!id) return; if(e.target.checked) S.pPick.add(id); else S.pPick.delete(id); drawPick(); }; }
  on('#dAdd','click',()=>{ const D=collectDaily(); D.msgs.push({ru:'',en:'',et:''}); S.cfg={...S.cfg,push:{...mergePush(S.cfg.push),daily:D}}; render(); });
  document.querySelectorAll('[data-deldm]').forEach(b=>b.onclick=()=>{ const D=collectDaily(); D.msgs.splice(+b.dataset.deldm,1); S.cfg={...S.cfg,push:{...mergePush(S.cfg.push),daily:D}}; render(); });
  on('#dailyForm','submit',e=>{ e.preventDefault(); const D=collectDaily();
    const slots=[...new Set(D.slots.map(x=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(x); if(!m||+m[1]>23||+m[2]>59) return null; return String(+m[1]).padStart(2,'0')+':'+m[2]; }).filter(Boolean))].sort();
    const msgs=D.msgs.filter(m=>m.ru); if(!slots.length){ showRes('dRes','Укажите хотя бы одно время, например 11:11'); return; } if(!msgs.length){ showRes('dRes','Добавьте хотя бы одну фразу'); return; }
    S.cfg={...S.cfg,push:{...mergePush(S.cfg.push),daily:{...D,slots,msgs}}}; persist(); toast('Ежедневные послания сохранены'); render(); });
  on('#dTest','click',async()=>{ const cid=$('#dTestClient').value; if(!cid){ showRes('dRes','Нет подписанных клиенток'); return; } const D=collectDaily(); S.cfg={...S.cfg,push:{...mergePush(S.cfg.push),daily:{...D,msgs:D.msgs.filter(m=>m.ru)}}}; persist(); await saveQ;
    try{ const r=await fn({action:'daily_test',client_id:cid,idx:+$('#dTestMsg').value||0}); showRes('dRes',r.sent?'Пробное послание отправлено.':'Не доставлено: у клиентки нет рабочих устройств.'); }catch(err){ showRes('dRes','Ошибка: '+err.message); } });
  on('#pushInit','click',async()=>{ try{ await fn({action:'init'}); S.pushKey=true; toast('Отправка подготовлена'); render(); }catch(e){ toast('Не удалось: '+e.message+'. Проверьте, что функция push развёрнута.'); } });
  on('#pPreview','click',async()=>{ try{ const r=await fn({...pushPayload(),preview:true}); showRes('pRes',`Получат: ${r.recipients} клиенток, устройств: ${r.devices}.`); }catch(e){ showRes('pRes','Ошибка: '+e.message); } });
  on('#pushForm','submit',async e=>{ e.preventDefault();
    const b=pushPayload();
    if(b.audience.type==='clients'&&!b.audience.ids.length){ showRes('pRes','Выберите хотя бы одну клиентку или поставьте «Всем подписанным».'); return; }
    try{ const pr=await fn({...b,preview:true});
      if(!pr.recipients){ showRes('pRes','Некому отправлять: нет подписанных клиенток для этого выбора.'); return; }
      if(!confirm(`Отправить ${pr.recipients} клиенткам (устройств: ${pr.devices})?\n\n${b.title.ru}\n${b.text.ru}`)) return;
      const r=await fn(b); showRes('pRes',`Отправлено: ${r.sent}, не доставлено: ${r.failed}, устаревших подписок удалено: ${r.removed}.`);
      await refreshPush(); render(); showRes('pRes',`Отправлено: ${r.sent}, не доставлено: ${r.failed}, устаревших подписок удалено: ${r.removed}.`);
    }catch(err){ showRes('pRes','Ошибка: '+err.message); } });
  on('#pcfgForm','submit',e=>{ e.preventDefault(); S.cfg={...S.cfg,push:collectPush()}; persist(); toast('Сохранено'); render(); });
  on('#pDryRun','click',async()=>{ S.cfg={...S.cfg,push:collectPush()}; persist(); await saveQ;
    try{ const r=await fn({action:'cron',force:true,dry:true}); await refreshPush(); render();
      showRes('pCronRes',`Пробный прогон: найдено ${Object.entries(r.candidates||{}).map(([k,v])=>(PKIND[k]||k)+' '+v).join(', ')||'ничего'}. Записано в журнал: ${r.dryLogged}. Ничего не отправлено.`); }
    catch(err){ showRes('pCronRes','Ошибка: '+err.message); } });
  on('#copyCron','click',()=>{ if(navigator.clipboard) navigator.clipboard.writeText(cronSql()).then(()=>toast('Запрос скопирован')); });
  on('#pushTest','click',async()=>{ const c=cur(); if(!c) return; try{ const r=await fn({action:'test',client_id:c.id}); toast(`Тест: отправлено ${r.sent}`); await refreshPush(); }catch(e){ toast('Ошибка: '+e.message); } });

function accordionize(){
  const panels=[...$app.querySelectorAll('.panel')].filter(p=>!p.closest('details')&&!p.hasAttribute('data-noacc')&&p.querySelector(':scope > h2, :scope > .gl-head'));
  const single=panels.length===1;
  panels.forEach(p=>{
    const h=p.querySelector(':scope > h2, :scope > .gl-head'), title=h.textContent.replace(/\s+/g,' ').trim().replace(/\s*\d+$/,'');
    const id=tab+'|'+view+'|'+title;
    const d=document.createElement('details'); d.className=p.className+' acc'; d.dataset.acc=id;
    const open=S.open[id]!==undefined?S.open[id]:(single||OPEN_DEFAULT.test(title)||!!p.querySelector(':scope > h2 .badge'));
    if(open) d.open=true;
    const sm=document.createElement('summary'); sm.appendChild(h);
    const body=document.createElement('div'); body.className='acc-body';
    while(p.firstChild) body.appendChild(p.firstChild);
    d.appendChild(sm); d.appendChild(body); p.replaceWith(d);
    d.addEventListener('toggle',()=>{ if(S.open[id]!==d.open) S.open[id]=d.open; });
  });
  document.querySelectorAll('form[id$="Form"]').forEach(f=>{
    const holder=f.querySelector('.acc-body')||f; subAccordion(holder);
  });
}
function subAccordion(c){
  const kids=[...c.children], idx=kids.map((k,i)=>k.classList&&k.classList.contains('sub')?i:-1).filter(i=>i>=0);
  if(idx.length<2) return;
  idx.forEach((start,n)=>{
    let end=(n+1<idx.length)?idx[n+1]:kids.length;
    for(let i=start+1;i<end;i++){ const k=kids[i]; if((k.tagName==='BUTTON'&&k.classList.contains('primary'))||(k.classList&&k.classList.contains('actions'))){ end=i; break; } }
    const head=kids[start], body=document.createElement('div'); body.className='sacc-body';
    const group=kids.slice(start+1,end), d=document.createElement('details'); d.className='sacc';
    const id=tab+'|'+view+'|sub|'+head.textContent.trim(); d.dataset.acc=id;
    if(S.open[id]) d.open=true;
    const sm=document.createElement('summary'); sm.appendChild(head); group.forEach(g=>body.appendChild(g));
    d.appendChild(sm); d.appendChild(body); c.insertBefore(d,kids[end]||null);
    d.addEventListener('toggle',()=>{ if(!!S.open[id]!==d.open) S.open[id]=d.open; });
  });
}

const LNAME={ru:'Русский',en:'English',et:'Eesti'};
S.tx={lang:'ru',q:'',draft:null,dirty:false};
const GT=()=>window.GC_TEXTS||{ru:{},en:{},et:{}};
function txDraft(){
  if(!S.tx.draft) S.tx.draft={texts:JSON.parse(JSON.stringify(S.cfg.texts||{})),svcNames:JSON.parse(JSON.stringify(S.cfg.svcNames||{})),tpl:JSON.parse(JSON.stringify((S.cfg.push&&S.cfg.push.tpl)||{}))};
  return S.tx.draft;
}
const defTx=(l,k)=>{ const v=(GT()[l]||{})[k]; const x=v!==undefined?v:GT().ru[k]; return Array.isArray(x)?x.join('\n'):String(x??''); };
const curTx=(l,k)=>{ const o=((txDraft().texts[l])||{})[k]; return o!==undefined?o:defTx(l,k); };
const paramsOf=k=>((window.GC_PARAMS||{})[k]||[]);
function txRows(l,q){
  const groups=window.GC_GROUPS||[], ql=String(q||'').toLowerCase(); let html='', total=0, changed=0;
  groups.forEach(([title,keys])=>{
    const rows=keys.filter(k=>k in GT().ru).filter(k=>!ql||k.toLowerCase().includes(ql)||defTx('ru',k).toLowerCase().includes(ql)||curTx(l,k).toLowerCase().includes(ql));
    if(!rows.length) return;
    const mods=rows.filter(k=>curTx(l,k)!==defTx(l,k)).length; total+=rows.length; changed+=mods;
    const id='texts|'+l+'|grp|'+title, open=ql?true:!!S.open[id];
    html+=`<details class="panel acc" data-acc="${esc(id)}" ${open?'open':''}><summary><h2>${esc(title)} <span class="muted small" style="font-weight:500">${rows.length}${mods?` · изменено ${mods}`:''}</span></h2></summary><div class="acc-body">`+
      rows.map(k=>{ const v=curTx(l,k), ps=paramsOf(k), mod=v!==defTx(l,k), rows_=Math.min(8,Math.max(2,Math.ceil(v.length/60)+v.split('\n').length-1));
        return `<div class="tx-row"><div class="tx-top"><code>${esc(k)}${mod?'<span class="mod"></span>':''}</code>${mod?`<button type="button" class="ghost" data-trs="${esc(k)}" style="padding:2px 10px">Вернуть исходный</button>`:''}</div>
          ${l!=='ru'?`<div class="muted small">По-русски: ${esc(defTx('ru',k).replace(/\n/g,' / '))}</div>`:''}
          <textarea data-tk="${esc(k)}" rows="${rows_}">${esc(v)}</textarea>
          ${ps.length?`<div class="muted small">Подставляется само: ${ps.map(p=>'{'+p+'}').join(' ')}. Не удаляйте эти слова в скобках.</div>`:''}
          ${Array.isArray(GT().ru[k])?'<div class="muted small">Каждый шаг с новой строки.</div>':''}</div>`; }).join('')+`</div></details>`;
  });
  return {html,total,changed};
}
function svcNamesBlock(l){
  if(l==='ru') return '<p class="muted small">Русские названия услуг меняются во вкладке «Условия» → «Услуги студии».</p>';

}
function tplBlock(l){
  const kinds=Object.entries(window.GC_PUSH||{}).filter(([k])=>k!=='midweek'), d=txDraft().tpl;
  return kinds.map(([k,v])=>{ const o=((d[k]||{})[l])||{}, t=o.t!==undefined?o.t:v[l].t, b=o.b!==undefined?o.b:v[l].b, ps=v.params||[];

}

function bindTexts(){
  if(tab!=='texts') return;
  document.querySelectorAll('details.acc[data-acc]').forEach(d=>{ if(d._w) return; d._w=1; d.addEventListener('toggle',()=>{ const id=d.dataset.acc; if(!!S.open[id]!==d.open) S.open[id]=d.open; }); });
  document.querySelectorAll('[data-txl]').forEach(b=>b.onclick=()=>{ S.tx.lang=b.dataset.txl; render(); });
  on('#txq','input',e=>{ S.tx.q=e.target.value; render(); });
  document.querySelectorAll('[data-tk]').forEach(el=>el.addEventListener('input',()=>{
    const d=txDraft(), l=S.tx.lang, k=el.dataset.tk; d.texts[l]=d.texts[l]||{};
    if(el.value===defTx(l,k)||el.value.trim()==='') delete d.texts[l][k]; else d.texts[l][k]=el.value;
    S.tx.dirty=true; }));
  document.querySelectorAll('[data-trs]').forEach(b=>b.onclick=()=>{ const d=txDraft(), l=S.tx.lang; if(d.texts[l]) delete d.texts[l][b.dataset.trs]; S.tx.dirty=true; render(); });
  document.querySelectorAll('[data-sn]').forEach(el=>el.addEventListener('input',()=>{
    const d=txDraft(), l=S.tx.lang, n=servicesOf()[+el.dataset.sn], def=((window.GC_SVC||{})[l]||{})[n]||''; d.svcNames[l]=d.svcNames[l]||{};
    if(el.value.trim()===''||el.value.trim()===def) delete d.svcNames[l][n]; else d.svcNames[l][n]=el.value.trim(); S.tx.dirty=true; }));
  document.querySelectorAll('[data-pt]').forEach(el=>el.addEventListener('input',()=>{
    const [k,l,f]=el.dataset.pt.split('|'), d=txDraft(), def=window.GC_PUSH[k][l][f]; d.tpl[k]=d.tpl[k]||{}; d.tpl[k][l]=d.tpl[k][l]||{};
    if(el.value===def||el.value.trim()==='') delete d.tpl[k][l][f]; else d.tpl[k][l][f]=el.value;
    if(!Object.keys(d.tpl[k][l]).length) delete d.tpl[k][l]; if(!Object.keys(d.tpl[k]).length) delete d.tpl[k]; S.tx.dirty=true; }));
  on('#txResetLang','click',()=>{ if(!confirm('Вернуть исходные тексты для языка «'+LNAME[S.tx.lang]+'»? Ваши правки в нём пропадут.')) return; const d=txDraft(); delete d.texts[S.tx.lang]; delete d.svcNames[S.tx.lang]; Object.keys(d.tpl).forEach(k=>{ delete d.tpl[k][S.tx.lang]; if(!Object.keys(d.tpl[k]).length) delete d.tpl[k]; }); S.tx.dirty=true; render(); });
  on('#txSave','click',saveTexts);
}
function saveTexts(){
  const d=txDraft(), miss=[];
  ['ru','en','et'].forEach(l=>Object.keys(d.texts[l]||{}).forEach(k=>{ const need=paramsOf(k).filter(p=>{ const def=(GT()[l]||{})[k]; return typeof def==='string'&&def.includes('{'+p+'}'); }); const lost=need.filter(p=>!String(d.texts[l][k]).includes('{'+p+'}')); if(lost.length) miss.push(`${LNAME[l]}: ${k} (нет ${lost.map(p=>'{'+p+'}').join(' ')})`); }));
  if(miss.length&&!confirm('В некоторых текстах пропали подставляемые слова, поэтому там может не быть числа или даты:\n\n'+miss.slice(0,8).join('\n')+(miss.length>8?'\n…':'')+'\n\nСохранить всё равно?')) return;
  const clean=o=>{ const r={}; Object.keys(o||{}).forEach(l=>{ if(o[l]&&Object.keys(o[l]).length) r[l]=o[l]; }); return r; };
  const push={...S.cfg.push}; push.tpl=clean(d.tpl);
  S.cfg={...S.cfg,texts:clean(d.texts),svcNames:clean(d.svcNames),push};
  S.tx.draft=null; S.tx.dirty=false; persist(); toast('Тексты сохранены. Клиентки увидят их при следующем обновлении страницы'); render();
}

  if(S.tokens[k]&&!confirm('Старая ссылка перестанет работать, а календарь нужно будет подключить заново. Продолжить?')) return;

const tv=(k)=>document.querySelector(`[data-w="${k}"]`).value;
function collectSched(){
  const B=mergeBooking(S.schedDraft||BKC());
  B.enabled=$('#sOn').checked; B.tz=$('#sTz').value.trim()||'Europe/Tallinn';
  B.stepMin=Math.max(15,+$('#sStep').value||60); B.horizonMonths=Math.min(12,Math.max(1,+$('#sHor').value||3));
  B.minNoticeHours=Math.max(0,+$('#sNotice').value||0);
  B.masters={tattoo:$('#sMt').value.trim()||BK_DEF.masters.tattoo,beauty:$('#sMb').value.trim()||BK_DEF.masters.beauty};
  ['weekday','weekend'].forEach(k=>['autoFrom','autoTo','reqFrom','reqTo'].forEach(f=>{ B[k][f]=tv(k+'.'+f); }));
  B.defaultMinutes=Math.max(15,+$('#sDef').value||60);
  const names=servicesOf(), svc={};
  names.forEach((n,si)=>{ const ps=[]; document.querySelectorAll(`[data-si="${si}"][data-f="master"]`).forEach(el=>{ const pi=el.dataset.pi;
    ps.push({master:el.value,min:Math.max(15,+document.querySelector(`[data-si="${si}"][data-pi="${pi}"][data-f="min"]`).value||60),couch:document.querySelector(`[data-si="${si}"][data-pi="${pi}"][data-f="couch"]`).checked}); });
    svc[n]={parts:ps.length?ps:svcParts(B,n)}; });
  B.svc=svc; B.durations={}; names.forEach(n=>{ B.durations[n]=svc[n].parts.reduce((a,p)=>a+p.min,0); });
  B.maxActive=Math.min(30,Math.max(1,Math.floor(+$('#sMaxA').value||5))); B.maxPending=Math.min(30,Math.max(1,Math.floor(+$('#sMaxP').value||3))); B.cancelHours=Math.max(0,+$('#sCh').value||0); B.lateFee=Math.max(0,+$('#sFee').value||0); B.freeLate={};
  document.querySelectorAll('[data-fl]').forEach(el=>{ const n=Math.max(0,Math.floor(+el.value||0)); if(n) B.freeLate[el.dataset.fl]=n; });
  return B;
}
function saveSchedule(e){
  e.preventDefault();
  const B=collectSched();
  try{ new Intl.DateTimeFormat('en',{timeZone:B.tz}); }catch(_){ toast('Неизвестный часовой пояс. Пример: Europe/Tallinn'); return; }
  for(const k of ['weekday','weekend']){ const w=B[k]; if((w.autoFrom&&w.autoTo&&w.autoFrom>=w.autoTo)||(w.reqFrom&&w.reqTo&&w.reqFrom>=w.reqTo)){ toast('Время «с» должно быть раньше «до»'); return; } }
  S.cfg={...S.cfg,booking:B}; S.schedDraft=null; persist(); toast(B.enabled?'Сохранено. Запись открыта':'Сохранено. Запись пока закрыта'); render();
}

/* ---------- доступ клиентки ---------- */
function accessPanel(c){
  const up=S.bookings.filter(b=>b.client_id===c.id&&['pending','confirmed'].includes(b.status)&&new Date(b.end_at)>new Date()).length;
  return `<div class="panel"><h2>Доступ и запись</h2>
    <p class="muted small">Устройств с уведомлениями: ${S.psubs.filter(x=>x.client_id===c.id).length}${S.psubs.some(x=>x.client_id===c.id)?' <button class="ghost" id="pushTest" style="padding:2px 10px">Тест</button>':''}</p>
    <p class="muted small">Email: ${esc(c.email||'не указан')}${c.email?(c.marketing?' · согласна на рассылки':' · без рассылок'):''} · будущих записей: ${up}</p>
    ${shownPin&&shownPin.id===c.id?`<div class="hint">${shownPin.temp?'Временный пароль':'PIN'} для ${esc(c.name)}: <b class="mono" style="font-size:18px">${esc(shownPin.pin)}</b><br>${shownPin.temp?'Отправьте клиентке в Instagram-директе: при входе она придумает свой пароль. ':'Передайте клиентке лично. '}После обновления страницы он больше не отображается.</div>`:''}
    <div class="grid"><label>Свой PIN (4–8 цифр)<input id="pinVal" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <div class="actions" style="align-self:end"><button id="pinSet">Задать PIN</button><button id="pinGen">Выдать временный пароль</button></div></div>
    <p class="muted small">Если клиентка забыла пароль, нажмите «Выдать временный пароль»: она войдёт с ним и сразу придумает свой. Запросы на сброс приходят наверх списка клиенток.</p></div>`;
}
async function setPin(random){
  const c=cur(); if(!c) return; const pin=random?String(Math.floor(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000)):($('#pinVal').value.trim());
  if(!/^\d{4,8}$/.test(pin)){ toast('PIN: от 4 до 8 цифр'); return; }
  const {data,error}=await sb.rpc('admin_set_pin',{p_client:c.id,p_pin:pin});
  if(error||(data&&data.error)){ toast('Не удалось задать PIN'); return; }
  shownPin={id:c.id,pin}; toast('PIN задан'); render();
}

/* ---------- данные, резервные копии, GDPR ---------- */
function saveFile(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type})), a=document.createElement('a');
  a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function markBackup(){ try{ localStorage.setItem('lastBackup',String(Date.now())); }catch(e){} }
function backupJson(){
  saveFile(`beauty-garage-backup-${stamp()}.json`,JSON.stringify({exportedAt:new Date().toISOString(),settings:S.cfg,clients:S.clients,bookings:S.bookings,blocks:S.blocks},null,2),'application/json');
  markBackup(); toast('Резервная копия скачана'); render();
}
function backupCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Имя','Вход','Телефон','Email','Рассылки','День рождения','Баланс','Потрачено','Создана']].concat(S.clients.map(c=>[c.name,c.login,c.phone,c.email,c.marketing?'да':'нет',c.birthday,c.balance,c.spent,new Date(c.createdAt).toISOString().slice(0,10)]));
  saveFile(`beauty-garage-clients-${stamp()}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv;charset=utf-8');
  markBackup(); toast('Список клиенток скачан'); render();
}
function exportClient(c){
  saveFile(`client-${norm(c.login).replace(/[^a-z0-9а-я_-]+/gi,'-')||'data'}-${stamp()}.json`,JSON.stringify({...c,bookings:S.bookings.filter(b=>b.client_id===c.id)},null,2),'application/json'); toast('Данные клиентки скачаны');
}
function dataView(){
  let last=0; try{ last=+localStorage.getItem('lastBackup')||0; }catch(e){}
  const days=last?Math.floor((Date.now()-last)/DAY):null;
  return `<div class="panel"><h2>Резервная копия</h2>
    <p class="${days===null||days>7?'neg':'muted'}">${days===null?'Копию на этом устройстве ещё не скачивали.':`Последняя копия: ${days} дн. назад.`} Рекомендуем скачивать раз в неделю.</p>
    <div class="actions"><button class="primary" id="bakJson">Скачать всё (JSON)</button><button id="bakCsv">Список клиенток (CSV)</button></div>
    <p class="muted small">Файлы содержат персональные данные клиенток. Храните их в защищённом месте и удаляйте старые копии.</p></div>
  <div class="panel"><h2>Персональные данные (GDPR)</h2>
    <p>Мы храним: имя, ник для входа, телефон (по желанию), день рождения (по желанию), историю визитов и бонусов.</p>
    <p class="muted">По запросу клиентки откройте её карточку: кнопка «Выгрузить данные клиентки» отдаёт всё, что о ней хранится, а «Удалить клиентку навсегда» стирает её записи. Не храните лишнего и не оставляйте старые резервные копии.</p>
    <p class="muted small">Перед запуском для широкой аудитории стоит добавить политику конфиденциальности и согласие на хранение данных и показать их юристу.</p></div>`;
}

/* ---------- boot ---------- */
const configured = window.SUPABASE_URL && !String(window.SUPABASE_URL).startsWith('ВСТАВЬТЕ');
const sb = configured && window.supabase ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY) : null;
function showMsg(title,text){ $app.innerHTML=`<header><h1>Beauty Garage: админка</h1></header><div class="panel"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p></div>`; }
function showLogin(err){
  $app.innerHTML=`<header><h1>Beauty Garage: админка</h1></header><div class="panel"><h2>Вход</h2>
    <form id="lf" style="display:flex;flex-direction:column;gap:12px">
      <label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Пароль<input id="lPass" type="password" autocomplete="current-password" required></label>
      ${err?`<div class="neg small">${esc(err)}</div>`:''}
      <button class="primary">Войти</button></form></div>`;
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
    if(error) showLogin('Неверный email или пароль.'); else boot();
  });
}
const CL_COLS='id,name,login,phone,birthday,balance,spent,disc,ref_by,ref_paid,last_earn,created_at,history,email,marketing,tasks';
async function load(){
  showMsg('Загрузка…','');
  const [s,c]=await Promise.all([sb.from('settings').select('cfg').eq('id',1).single(), sb.from('clients').select(CL_COLS)]);
  if(s.error||c.error){ showMsg('Не удалось загрузить данные','Если вы только что обновили файлы, сначала выполните в Supabase скрипт migration-glam.sql. Иначе проверьте config.js.'); return; }
  const [bk,bl,pr]=await Promise.all([sb.from('bookings').select('*').order('start_at'),sb.from('blocks').select('*').order('start_at'),sb.from('admin_private').select('feed_token,feed_tattoo,feed_beauty').eq('id',1).single()]);
  if(bk.error||bl.error){ showMsg('Не удалось загрузить записи','Сначала выполните в Supabase скрипт migration-booking.sql (SQL Editor), затем обновите страницу.'); return; }
  S.bookings=bk.data||[]; S.blocks=bl.data||[]; S.tokens={all:(pr.data&&pr.data.feed_token)||'',tattoo:(pr.data&&pr.data.feed_tattoo)||'',beauty:(pr.data&&pr.data.feed_beauty)||''};
  try{ const ss=await sb.auth.getSession(); const em=String((ss.data&&ss.data.session&&ss.data.session.user&&ss.data.session.user.email)||'').toLowerCase();
    const ad=await sb.from('admins').select('email,master'); S.admins=ad.data||[]; S.me=S.admins.find(a=>String(a.email).toLowerCase()===em)||{email:em,master:null}; }catch(_){}
  S.cfg=s.data.cfg; cfgSnap=JSON.stringify(S.cfg); S.cfg.glam=mergeGlam(S.cfg.glam); S.cfg.booking=mergeBooking(S.cfg.booking); S.cfg.push=mergePush(S.cfg.push); S.cfg.rewards=mergeRewards(S.cfg.rewards);
  const [ps,pl,pc]=await Promise.all([sb.from('push_subs').select('id,client_id,lang,enabled,last_ok,created_at,ua'),sb.from('push_log').select('*').order('created_at',{ascending:false}).limit(40),sb.rpc('push_config')]);
  S.pushReady=!(ps.error||pl.error); S.psubs=(ps.data)||[]; S.plog=(pl.data)||[]; S.pushKey=!!(pc.data&&pc.data.key);
  await loadRwBal(); S.clients=c.data.map(fromRow); S.clients.forEach(x=>snap.set(x.id,JSON.stringify(toRow(x))));
  persist(); render();
  loadClaims(true); loadPwReq(true); setInterval(refreshBookings,60000); setInterval(()=>{ const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; loadClaims(true); loadPwReq(true); },60000);
}
async function boot(){
  if(!sb){ showMsg('Нужна настройка','Откройте файл config.js и вставьте данные из Supabase.'); return; }
  const {data}=await sb.auth.getSession();
  if(!data.session) showLogin(); else load();
}
boot();
